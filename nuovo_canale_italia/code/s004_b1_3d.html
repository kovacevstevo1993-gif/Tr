<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#1c1b48;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 004 - blocco 1 (HOOK): 100 euro un pieno, Spagna 13 in meno, differenza anche in Italia =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from '/code/lib/stage.js';
import * as S from '/code/lib/s004.js';
const DUR=17.571;
const KF=[[0,[0,2.7,6.4],[0,2.6,0]],[0.9,[.15,2.8,7.4],[0,2.55,0]],[3.0,[-.25,3.0,9.8],[0,2.45,0]],[7.6,[.2,3.0,9.9],[.6,2.45,0]],[8.9,[3.0,2.9,9.5],[3.0,2.5,0],'w'],[12.5,[3.2,3.0,9.3],[3.0,2.5,0]],[14.2,[1.5,3.5,12.8],[1.5,2.5,0],'w'],[DUR,[1.5,3.7,13.6],[1.5,2.5,0]]];
const st=await createStage({dur:DUR,centers:[0,3],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
S.backdrop(scene,m);
const pA=S.pump(m);pA.position.set(0,0,0);scene.add(pA);
const pB=S.pump(m,{accent:m.orange});pB.position.set(3,0,0);scene.add(pB);
const dst=S.dustp(220,0xffc060,.08);scene.add(dst);const dst2=S.dustp(160,0xffffff,.06);scene.add(dst2);
const pill=(t,o)=>st.tag(t,Object.assign({bg:'rgba(14,16,40,.94)',border:'#ffb000',fill:'#ffffff',w:640},o));
const tPieno=pill(['PIENO DI BENZINA'],{border:'#ffb000',sw:2.7,font:'bold 54px PM',h:160});
const t50=pill(['50 LITRI'],{border:'#cdee3c',sw:2.4,font:'bold 72px PM',h:170});
const tIt=S.flagTag(st,'ITALIA','IT',{border:'#cdee3c',sw:2.3});
const tEu=S.flagTag(st,'COMMISSIONE EUROPEA','EU',{border:'#5a86ff',sw:2.4,w:900,h:170,font:'bold 46px PM'});
const tEs=S.flagTag(st,'SPAGNA','ES',{border:'#ffb000',sw:2.6});
const tMeno=pill(['- 13 EURO'],{border:'#25b36a',sw:3.0,font:'bold 90px AB',h:200,fill:'#25b36a'});
const tQ=st.label((g,W,H)=>{g.fillStyle='rgba(14,16,40,.94)';st.rr(g,6,6,W-12,H-12,60);g.fill();g.strokeStyle='#ffb000';g.lineWidth=9;g.stroke();g.fillStyle='#ffb000';g.shadowColor='#ffb000';g.shadowBlur=30;g.font='bold 190px AB';g.textAlign='center';g.textBaseline='middle';g.fillText('?',W/2,H/2+12);},300,300,1.5,'?');
const tSolo=S.flagTag(st,"SENZA USCIRE DALL'ITALIA",'IT',{border:'#cdee3c',sw:3.6,w:1000,h:170,font:'bold 50px PM'});
const lA=pA.userData.lcd,lB=pB.userData.lcd;
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // pompe: entrano con rimbalzo (A subito: hook)
  pA.scale.setScalar(1);pA.position.y=Math.sin(t*1.2)*.03*damp;
  const eB=eb(prog(t,7.4,7.9));pB.scale.setScalar(Math.max(.001,eB));pB.visible=eB>.002;
  pA.userData.noz.rotation.z=Math.sin(t*1.5)*.05*damp;
  // LCD A: cifre che girano in fretta fino a 100
  const fr=Math.floor(t*30);const v=t<.78?Math.floor(rnd(fr*7+3)*180)+10:100;
  const topA=t<5.38?'EURO':'ITALIA';const smA=t<3.0?'':(t<4.06?'BENZINA':'50 LITRI');
  lA.userData.set(topA,v+' €',smA);
  // LCD B
  const bm=t<11.14;lB.userData.set('SPAGNA',bm?'50 L':'-13 €',bm?'STESSO PIENO':'CIRCA','#ffb000'.replace('#ffb000',bm?'#ffb000':'#25d07a'));
  // scritte
  const outA=1-eo(prog(t,7.8,8.2));
  st.setSprite(tPieno,0,4.75,0,eo(prog(t,2.9,3.3))*(1-eo(prog(t,4.95,5.25))));
  st.setSprite(t50,0,4.05,0,eo(prog(t,4.05,4.4))*(1-eo(prog(t,6.5,6.8))));
  st.setSprite(tIt,0,4.75,0,eo(prog(t,5.35,5.7))*(1-eo(prog(t,6.3,6.6))));
  st.setSprite(tEu,.35,3.85,0,eo(prog(t,6.85,7.15))*(1-eo(prog(t,7.35,7.6))));
  st.setSprite(tEs,3,4.75,0,eo(prog(t,8.75,9.1))*(1-eo(prog(t,12.7,13.0))));
  st.setSprite(tMeno,3,4.0,0,eo(prog(t,11.1,11.45))*(1-eo(prog(t,12.7,13.0))),1+.04*Math.sin(t*6)*(t>11.5&&t<13?1:0));
  st.setSprite(tQ,1.5,4.5+Math.sin(t*2)*.05*damp,1.5,eo(prog(t,13.8,14.3)));
  st.setSprite(tSolo,1.5,1.3,2.2,eo(prog(t,16.1,16.5)));
  dst.userData.update(.1,t,0,2.6,1.5,3.0);dst2.userData.update(11.1,t,3,3,1.5,2.6);
  st.render(t,{shakes:[.12,8.9,11.14],flashes:[.12,11.14]});
}
boot(st,draw);
</script></body></html>
