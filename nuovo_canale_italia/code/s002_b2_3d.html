<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0c0f;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 002 - blocco 2: 29 ottobre, tassi fermi (quadrante + lucchetto), poche ore prima (orologio + comunicato) =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd,RED,YEL,PAPER} from '/code/lib/stage.js';
import * as S from '/code/lib/s002.js';
const DUR=13.41;
const KF=[[0,[0,4.7,13.2],[0,4.2,0]],[3.9,[0,4.3,11.4],[0,4.0,0]],[4.3,[0,4.2,11.2],[0,4.0,0],'w'],[8.4,[0,4.2,11.0],[0,4.0,0]],[8.9,[0,4.2,11.4],[0,4.0,0],'w'],[DUR,[0,4.2,11.4],[0,4.0,0]]];
const st=await createStage({dur:DUR,centers:[0],kf:KF});
const {scene}=st;const m=S.mats();
const cal=S.sheet((g,W,H)=>{g.fillStyle='#F3F0E8';g.fillRect(0,0,W,H);g.fillStyle='#E32119';g.fillRect(0,0,W,170);g.fillStyle='#F3F0E8';g.font='bold 100px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('OTTOBRE',W/2,88);
  g.fillStyle='#16181D';g.font='400 330px AB';g.fillText('29',W/2,H*.60);g.fillStyle='#8A8F98';g.font='bold 74px PM';g.fillText('2026',W/2,H*.9);g.strokeStyle='#16181D';g.lineWidth=10;g.strokeRect(5,5,W-10,H-10);},640,760,1.6,null);scene.add(cal);
const dial=S.dial(m,{R:1.5});dial.position.set(0,4.0,0);dial.scale.setScalar(1.25);scene.add(dial);
const lock=S.padlock(m);scene.add(lock);
const clk=S.clock(m,1.2);clk.position.set(0,3.9,0);clk.scale.setScalar(1.3);scene.add(clk);
const env=S.envelope(m);scene.add(env);
const doc=S.sheet((g,W,H)=>{g.fillStyle='#F8F6EF';g.fillRect(0,0,W,H);g.fillStyle='#16181D';g.textAlign='center';g.textBaseline='middle';g.font='bold 46px PM';g.fillText('COMUNICATO BCE',W/2,70);g.fillStyle='#8A8F98';g.font='bold 34px PM';g.fillText('29/10/2026',W/2,122);
  g.fillStyle='#16181D';g.font='bold 58px PM';['LA PRESIDENTE','LAGARDE LASCIA','IL 7 FEBBRAIO','2027'].forEach((l,i)=>g.fillText(l,W/2,230+i*80));g.fillStyle='#d4cfc1';for(let i=0;i<5;i++)g.fillRect(70,590+i*34,W-140-(i%2)*120,12);g.strokeStyle='#d4cfc1';g.lineWidth=8;g.strokeRect(4,4,W-8,H-8);},560,820,2.1,null);scene.add(doc);
const tCal=st.tag(['TASSI INVARIATI'],{border:'#FFE14A',sw:3.1,font:'bold 62px PM',h:170});
const tDep=st.tag(['TASSO SUI DEPOSITI'],{sw:3.3,font:'bold 56px PM',h:160});
const cNum=st.counter({sw:2.6,font:'150px AB',color:'#FFE14A',border:'#FFE14A',h:270,w:720});
const cTime=st.counter({sw:2.4,font:'130px PM',color:'#F3F0E8',border:'#E32119',h:260});
const tPoche=st.tag(['POCHE ORE PRIMA'],{border:'#E32119',sw:3.3,font:'bold 58px PM',h:160});
const tLascia=st.tag(['LASCIA IL 7 FEBBRAIO'],{border:'#FFE14A',sw:3.4,font:'bold 54px PM',h:160,fill:'#FFE14A'});
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // calendario 29 ottobre
  const cp=prog(t,.15,.6),cout=1-eo(prog(t,3.4,3.9));cal.visible=cp>0&&cout>.02;cal.position.set(0,6.8+Math.sin(t*1.5)*.05*damp,.4);cal.scale.setScalar(Math.max(.001,(1+(1-eb(cp))*1.6)*cout));cal.rotation.z=Math.sin(t*1.1)*.02*damp;
  // quadrante: lancetta sale a 2,5 e si ferma
  const dp=prog(t,1.0,1.7),dout=1-eo(prog(t,8.45,8.95));dial.visible=dp>0&&dout>.02;dial.scale.setScalar(Math.max(.001,1.1*eb(dp)*dout));dial.rotation.y=Math.sin(t*.9)*.1*damp;
  const val=2.5*eio(prog(t,1.5,2.6))+(t>2.9&&t<3.6?0:0);dial.userData.set(val+Math.sin(t*40)*.0);
  // lucchetto: scende e si chiude a 3.3
  const lp=prog(t,2.7,3.3),lk=eo(prog(t,3.3,3.5));lock.visible=lp>0&&dout>.02;lock.position.set(0,3.5+ (1-eo(lp))*3.5,.9);lock.scale.setScalar(1.1*dout);lock.userData.shackle.position.y=.45+(1-lk)*.32;lock.rotation.y=Math.sin(t*1.2)*.12*damp;
  st.setSprite(tCal,0,2.3,1.2,eo(prog(t,3.0,3.4))*(1-eo(prog(t,4.2,4.6))));
  // tasso sui depositi + contatore 2,50%
  st.setSprite(tDep,0,6.35,1.0,eo(prog(t,4.4,4.8))*dout);
  const cv=2.5*eio(prog(t,5.5,6.1));cNum.userData.set(cv.toFixed(2).replace('.',',')+'%');st.setSprite(cNum,0,2.5+Math.sin(t*2)*.04*damp,1.2,eo(prog(t,5.5,5.9))*dout);
  // orologio: riavvolge da 14:15 a 11:00
  const kp=prog(t,8.6,9.2),kout=1;clk.visible=kp>0&&t<11.0;const rw=eio(prog(t,9.3,10.5));
  const outc=1-eo(prog(t,10.7,11.2));clk.scale.setScalar(Math.max(.001,1.15*eb(kp)*outc));clk.visible=kp>0&&outc>.02;clk.userData.set(2.25-3.25*rw,15-195*rw);
  const mins=Math.round(14*60+15-195*rw);cTime.userData.set(String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'));
  st.setSprite(cTime,0,2.4,1.2,eo(prog(t,9.0,9.4))*outc);
  st.setSprite(tPoche,0,6.35,1.0,eo(prog(t,8.7,9.1))*outc);
  // busta + comunicato
  const ep=prog(t,10.8,11.5);env.visible=ep>0;env.position.set(0,2.0,.2);env.scale.setScalar(Math.max(.001,eb(ep)));env.userData.flap.rotation.x=-eio(prog(t,11.5,12.0))*Math.PI*.97;env.rotation.y=Math.sin(t*1.1)*.1*damp;
  const rp=eio(prog(t,11.7,12.7));doc.visible=rp>0;doc.position.set(0,2.0+rp*1.9+Math.sin(t*1.4)*.05*damp,.5+rp*.3);doc.scale.setScalar(Math.max(.001,rp));
  st.setSprite(tLascia,0,6.5,1.4,eo(prog(t,12.2,12.7)));
  st.render(t,{shakes:[.15,3.3,10.8],flashes:[.15,3.3]});
}
boot(st,draw);
</script></body></html>
