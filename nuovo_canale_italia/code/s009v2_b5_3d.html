<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#cfe8f2;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from "/code/lib/stage.js";
import * as S from "/code/lib/s010.js";
await S.loadFont();const T=await S.loadTimes('/short009_v2/tempi.json');
const dk=(o)=>Object.assign({bg:"rgba(10,40,52,.95)",border:"#ffb347",fill:"#ffffff"},o);
const rd=(o)=>Object.assign({bg:"rgba(229,57,43,.97)",border:"#ffffff",fill:"#ffffff"},o);
const gn=(o)=>Object.assign({bg:"rgba(31,184,196,.97)",border:"#ffffff",fill:"#06222c"},o);
const W=(t,a,b,c,d)=>eo(prog(t,a,b))*(1-eo(prog(t,c,d)));
const POP=(t,a,d=.35)=>Math.max(.001,eb(prog(t,a,a+d)));
// ===== blocco 5: cosa fare: estratto conto INPS con Spid o CIE, solo informativo, ti dice dove sei; informazione generale; mi piace e iscriviti a Soldi che Contano (tramonto) =====
const B='b05',DUR=S.dur(B),cEst=S.cue(B,'estratto'),cCar=S.cue(B,'carta'),cVal=S.cue(B,'valore'),cDic=S.cue(B,'dice'),cInf=S.cue(B,'Informazione'),cMet=S.cue(B,'Mettimi'),cIsc=S.cue(B,'iscriviti'),cSol=S.cue(B,'Soldi');
const KF=S.shots([[0,cEst,[.4,1.7,8.0],[0,1.9,0],[-.4,1.9,7.0],[0,1.9,0]],[cEst,cCar,[-1.0,2.0,7.0],[0,1.9,0],[.9,2.0,7.0],[0,1.9,0]],[cCar,cVal,[1.0,1.7,7.2],[0,1.9,0],[-.6,2.1,6.8],[0,1.9,0]],[cVal,cInf,[0,2.4,7.8],[0,1.9,0],[0,2.0,6.8],[0,1.9,0]],[cInf,cMet,[-1.2,3.4,10.4],[0,2.0,-2],[1.0,2.8,9.2],[0,2.0,-2]],[cMet,DUR,[0,1.7,8.2],[0,2.2,0],[0,2.0,7.0],[0,2.2,0]]],DUR);
const st=await createStage({dur:DUR,centers:[],kf:KF,theme:S.THEME});const {scene}=st;const m=S.mats();
S.beach(scene,m);S.extras(scene,m);
const ph=S.phone3d(m);scene.add(ph);
const mag=new THREE.Group();mag.add(new THREE.Mesh(new THREE.TorusGeometry(.5,.07,16,40),m.gold));mag.add(new THREE.Mesh(new THREE.CircleGeometry(.48,32),new THREE.MeshStandardMaterial({color:0xcff3ff,transparent:true,opacity:.28,roughness:.1})));const hd=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,.9,12),m.woodD);hd.position.set(.45,-.5,0);hd.rotation.z=-.7;mag.add(hd);scene.add(mag);
const nSp=S.numGroup(scene,'SPID','O CARTA D\'IDENTITÀ',0x35d6e0,{ms:.42,ss:.12,subCol:0x12303a});
const circ=S.sheet((c,W_,H_)=>{c.fillStyle='#fbfaf5';c.fillRect(0,0,W_,H_);c.fillStyle='#12303a';c.font='bold 44px AB';c.textAlign='center';c.textBaseline='middle';c.fillText('CIRCOLARE N. 28',W_/2,100);c.fillStyle='#ff6b57';c.font='bold 36px PM';c.fillText('16 MARZO 2026',W_/2,170);c.fillStyle='#c9cfda';for(let i=0;i<9;i++)c.fillRect(60,250+i*52,W_-120-(i%3)*80,14);c.strokeStyle='#12303a';c.lineWidth=6;c.strokeRect(6,6,W_-12,H_-12);},520,740,2.6,null);scene.add(circ);
const ok=S.check();scene.add(ok);const heart=S.heart();scene.add(heart);const star=S.star();scene.add(star);
const nS1=S.num3d('SOLDI CHE',{size:.21,color:0xf3be3a});const nS2=S.num3d('CONTANO',{size:.27,color:0xf3be3a});scene.add(nS1,nS2);const conf=S.confetti(scene,110);
const tFar=st.tag(['COSA FARE'],dk({sw:3.0,font:'bold 92px AB',w:900,h:200,border:'#1fb8c4'}));
const tEst=st.tag(['ESTRATTO CONTO','DELL\'INPS'],dk({sw:3.0,font:'bold 72px AB',w:960,h:300}));
const tSp=st.tag(['CON SPID O CARTA','D\'IDENTITÀ ELETTRONICA'],dk({sw:3.0,font:'bold 56px AB',w:1000,h:300,border:'#1fb8c4'}));
const tInfo=st.tag(['VALORE SOLO','INFORMATIVO'],dk({sw:3.0,font:'bold 78px AB',w:900,h:300}));
const tDove=st.tag(['TI DICE','DOVE SEI'],gn({sw:3.0,font:'bold 82px AB',w:900,h:300}));
const tGen=st.tag(['INFORMAZIONE GENERALE','NON CONSULENZA'],dk({sw:3.0,font:'bold 58px AB',w:1000,h:300}));
const tLike=st.tag(['METTI MI PIACE'],dk({sw:3.0,font:'bold 88px AB',w:940,h:210,border:'#ff3b5c'}));
const tSub=st.tag(['ISCRIVITI A'],dk({sw:3.0,font:'bold 80px AB',w:760,h:190}));
const A=S.makeAnchor(st,KF);
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));S.liveBeach(scene,t);S.setDay(scene,st,Math.max(S.dayU(B,t),.9));
  const pI=.55+.45*POP(t,0,.5),pO=1-eo(prog(t,cInf,cInf+.4));ph.visible=pO>.01;ph.position.set(0,1.95+Math.sin(t*1.5)*.06,0);ph.rotation.set(-.05,Math.sin(t*.7)*.3,Math.sin(t*1.1)*.03);ph.scale.setScalar(Math.max(.001,.95*pI*pO));
  const mI=POP(t,cEst,.4);mag.visible=t>cEst-.05&&pO>.01;mag.position.set(.3+Math.sin(t*1.3)*.25,1.5+Math.sin(t*1.6)*.55+.3,.5);mag.scale.setScalar(Math.max(.001,.7*mI*pO));
  const sI=POP(t,cCar,.4)*(1-eo(prog(t,cVal-.3,cVal)));nSp.visible=false;nSp.position.set(.9,3.0,.4);nSp.scale.setScalar(Math.max(.001,sI));nSp.rotation.y=Math.sin(t*.9)*.2;
  const kI=POP(t,cDic,.4)*pO;ok.visible=t>cDic-.05&&pO>.01;ok.position.set(1.0,2.2,.5);ok.scale.setScalar(Math.max(.001,.75*kI));ok.rotation.y=Math.sin(t*3)*.3;
  const cI=POP(t,cInf,.45)*(1-eo(prog(t,cMet-.1,cMet+.2)));circ.visible=cI>.002;circ.position.set(0,2.0+Math.sin(t*1.5)*.05,.4);circ.rotation.set(-.06,Math.sin(t*.8)*.2,Math.sin(t*1.2)*.03);circ.scale.setScalar(Math.max(.001,.5*cI));
  const hI=POP(t,cMet,.45)*(1-eo(prog(t,cIsc-.1,cIsc+.2)));heart.visible=hI>.002;heart.position.set(0,2.0+Math.sin(t*3)*.07,.6);heart.scale.setScalar(Math.max(.001,.6*hI*(1+.08*Math.sin(t*7))));heart.rotation.y=Math.sin(t*1.5)*.5;
  const stI=POP(t,cIsc,.45)*(1-eo(prog(t,cSol-.1,cSol+.2)));star.visible=stI>.002;star.position.set(0,2.1,.6);star.scale.setScalar(Math.max(.001,.65*stI));star.rotation.y=Math.sin(t*1.6)*.55;
  const nI=POP(t,cSol,.5);nS1.visible=nS2.visible=t>cSol-.05;nS1.position.set(0,2.55+Math.sin(t*1.8)*.04,.6);nS2.position.set(0,2.05+Math.sin(t*1.8+1)*.04,.6);nS1.scale.setScalar(nI);nS2.scale.setScalar(nI);nS1.rotation.y=nS2.rotation.y=Math.sin(t*.9)*.2;
  conf.userData.set(cSol,t,[0,2.6,.6]);
  A(tFar,t,.66,.72,W(t,-.3,.2,cEst-.25,cEst));
  A(tEst,t,.8,.66,W(t,cEst,cEst+.3,cCar-.3,cCar));
  A(tSp,t,.88,.64,W(t,cCar,cCar+.3,cVal-.3,cVal));
  A(tInfo,t,.66,.66,W(t,cVal,cVal+.3,cDic-.2,cDic));
  A(tDove,t,.66,.66,W(t,cDic,cDic+.3,cInf-.3,cInf));
  A(tGen,t,.88,.6,W(t,cInf,cInf+.3,cMet-.3,cMet));
  A(tLike,t,.78,.7,W(t,cMet,cMet+.3,cIsc-.3,cIsc));
  A(tSub,t,.6,.7,W(t,cIsc,cIsc+.3,cSol-.2,cSol));
  st.render(t,{shakes:[cMet,cIsc,cSol],flashes:[cSol]});
}
boot(st,draw);
</script></body></html>
