<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#c6ebe3;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 003 - blocco 4: finche il Parlamento non vota tutto puo cambiare, guarda il libretto, scrivimi nei commenti =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from "/code/lib/stage.js";
import * as S from "/code/lib/s003.js";
const ap=(t,a,d=.5)=>eb(prog(t,a,a+d)),ou=(t,a,d=.45)=>1-eo(prog(t,a,a+d));
const fade=(t,a,b)=>eo(prog(t,a,a+.35))*(b?1-eo(prog(t,b,b+.35)):1);
const show=(o,s,t,a,b)=>{const k=ap(t,a)*(b?ou(t,b):1);o.visible=k>.002;o.scale.setScalar(Math.max(.001,s*k));return k;};
const DUR=16.69;
const KF=[[0,[0,3.9,10.8],[0,2.9,0]],[7.4,[0,3.8,10.4],[0,2.9,0]],[7.9,[0,3.7,9.8],[0,3.0,0],'w'],[DUR,[0,3.8,9.6],[0,3.1,0]]];
const st=await createStage({dur:DUR,centers:[0],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
const pill=(t,o)=>st.tag(t,Object.assign({bg:'rgba(255,255,255,.96)',border:'#17324d',fill:'#17324d',w:600},o));

const parl=S.parliament(m);parl.scale.setScalar(.8);parl.position.set(0,0,-.6);scene.add(parl);
const lib=S.libretto();scene.add(lib);const mag=S.magnifier(m);scene.add(mag);
const bub=S.bubble(Object.assign({},m,{white:m.coral}));scene.add(bub);
const fin=S.sheet((g,W,H)=>{g.fillStyle='#fffaf0';g.fillRect(0,0,W,H);g.fillStyle='#17324d';g.fillRect(0,0,W,110);g.fillStyle='#ffc233';g.font='bold 54px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('TESTO FINALE',W/2,58);g.fillStyle='#c9d3dc';for(let i=0;i<7;i++)g.fillRect(60,170+i*48,W-120-(i%3)*90,18);g.strokeStyle='#17324d';g.lineWidth=10;g.strokeRect(5,5,W-10,H-10);},520,640,2.0,null);scene.add(fin);
const dst=S.dust(160,0xffc233,.08);scene.add(dst);
const tVota=pill(['IL PARLAMENTO VOTA'],{border:'#17324d',sw:3.3,font:'bold 46px PM',h:150}),tCamb=pill(['TUTTO PUÒ CAMBIARE'],{border:'#ff6b4a',sw:3.4,font:'bold 46px PM',h:150,fill:'#ff6b4a'}),tCond=pill(['CONDIZIONI PRECISE'],{border:'#ffc233',sw:3.4,font:'bold 46px PM',h:150});
const tLib=pill(['GUARDA IL LIBRETTO'],{border:'#2b5aa8',sw:3.4,font:'bold 46px PM',h:150}),tCom=pill(['SCRIVILO NEI COMMENTI'],{border:'#1f9d8a',sw:3.4,font:'bold 40px PM',h:150}),tKw=pill(['QUANTI kW HA LA TUA AUTO?'],{border:'#ff6b4a',sw:3.5,font:'bold 36px PM',h:150}),tResta=pill(['RESTA QUI'],{border:'#17324d',sw:2.9,font:'bold 80px PM',h:180,fill:'#17324d',bg:'rgba(255,194,51,.98)'}),tAgg=pill(['TI AGGIORNO SUL','TESTO FINALE'],{border:'#17324d',sw:3.2,font:'bold 46px PM'});
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // parlamento che traballa = tutto puo cambiare
  const kp=show(parl,.8,t,1.9,7.7);const wob=eo(prog(t,3.64,4.2))*(1-eo(prog(t,6.4,7.0)));parl.rotation.z=Math.sin(t*9)*.05*wob;parl.rotation.y=Math.sin(t*.9)*.1;parl.position.y=Math.abs(Math.sin(t*9))*.12*wob;
  st.setSprite(tVota,0,5.0,0,fade(t,1.8,3.6));st.setSprite(tCamb,0,5.0,0,fade(t,3.7,5.0));st.setSprite(tCond,0,5.0,0,fade(t,5.1,7.6));
  dst.userData.update(3.64,t,0,2.2,0,2.4);
  // libretto
  const lp=eio(prog(t,7.9,8.8));lib.visible=lp>.002;lib.position.set(0,3.35+(1-lp)*(-4.5)+Math.sin(t*1.3)*.05*damp,2.2);lib.rotation.y=(1-lp)*.9;lib.scale.setScalar(Math.max(.001,lp));
  lib.userData.hl.material.opacity=.55*eo(prog(t,8.8,9.3))*(.75+.25*Math.sin(t*7)*damp);
  st.setSprite(tLib,0,5.0,0,fade(t,7.9,9.9));
  const mp=ap(t,9.2,.4)*(1-eo(prog(t,9.9,10.4)));mag.visible=mp>.002;mag.position.set(.75+Math.sin(t*2)*.04*damp,3.3,3.0);mag.scale.setScalar(Math.max(.001,.65*mp));
  // fumetto commenti
  const bp=show(bub,1.0,t,10.2,13.3);bub.position.set(0,1.55+Math.sin(t*2)*.06*damp,2.8);bub.rotation.z=Math.sin(t*1.4)*.05*damp;
  st.setSprite(tCom,0,5.0,0,fade(t,9.7,11.0));st.setSprite(tKw,0,5.0,0,fade(t,11.1,13.3));
  // resta qui + testo finale
  lib.visible=lib.visible&&t<13.4;lib.scale.multiplyScalar(1-eo(prog(t,12.9,13.4)));
  st.setSprite(tResta,0,5.0+Math.sin(t*3)*.05*damp,0,fade(t,13.5,14.6));
  const kf=show(fin,1.0,t,14.7,0);fin.position.set(0,3.2+Math.sin(t*1.4)*.05*damp,1.6);fin.rotation.z=-.05+Math.sin(t*1.1)*.03*damp;
  st.setSprite(tAgg,0,5.0,0,fade(t,14.7,0));
  st.render(t,{shakes:[1.9,3.64,7.9],flashes:[]});
}
boot(st,draw);
</script></body></html>
