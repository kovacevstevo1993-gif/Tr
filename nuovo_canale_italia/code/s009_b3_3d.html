<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#cfe8f2;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from "/code/lib/stage.js";
import * as S from "/code/lib/s009.js";
const dk=(o)=>Object.assign({bg:"rgba(10,40,52,.95)",border:"#ffb347",fill:"#ffffff"},o);
const rd=(o)=>Object.assign({bg:"rgba(229,57,43,.97)",border:"#ffffff",fill:"#ffffff"},o);
const gn=(o)=>Object.assign({bg:"rgba(31,184,196,.97)",border:"#ffffff",fill:"#06222c"},o);
// ===== Short 009 - blocco 3: eccezioni (lavori gravosi con 30 anni di contributi e altre categorie: niente aumento); anticipata: l'assegno parte di regola 3 mesi dopo la maturazione (16,77 s) =====
const DUR=16.77;
const KF=[[0,[0,2.8,8.6],[0,1.8,0]],[4.8,[1.1,3.0,8.4],[0,1.8,0]],[9.8,[-1.0,2.9,8.2],[0,2.0,0]],[DUR,[.5,2.9,7.4],[0,2.1,.5]]];
const st=await createStage({dur:DUR,centers:[],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
S.beach(scene,m);
const hat=S.hardHat(m);hat.position.set(-.6,1.0,2.0);scene.add(hat);
const ped=new THREE.Mesh(new THREE.CylinderGeometry(.8,.95,.9,32),m.woodL);ped.position.set(-.6,.45,2.0);ped.castShadow=true;ped.receiveShadow=true;scene.add(ped);
const tiles=S.yearTiles(m,{cols:6,max:30,s:.3});const tg=new THREE.Group();tg.add(tiles);tg.position.set(0,.2,.2);scene.add(tg);
const sNo=S.signPost(['NESSUN','AUMENTO'],{w:3.0,h:1.6,acc:'#1fb8c4'});sNo.position.set(0,0,1.4);scene.add(sNo);
const ok=S.check();scene.add(ok);
const hg=S.hourglass(m);scene.add(hg);
const mp=[1,2,3].map(i=>{const p=S.monthPlate(String(i),'MESE',i===3?'#1fb8c4':'#ff6b57');scene.add(p);return p;});
const tEcc=st.tag(['CI SONO','ECCEZIONI'],dk({sw:3.0,font:'bold 84px AB',w:900,h:300}));
const tGra=st.tag(['LAVORI GRAVOSI','30 ANNI DI CONTRIBUTI'],dk({sw:3.0,font:'bold 62px AB',w:1000,h:300,border:'#1fb8c4'}));
const tAlt=st.tag(['ALTRE CATEGORIE','PREVISTE DALLA LEGGE'],dk({sw:3.0,font:'bold 60px AB',w:1000,h:300}));
const tNo=st.tag(['NIENTE','AUMENTO'],gn({sw:3.0,font:'bold 90px AB',w:900,h:300}));
const tAnt=st.tag(['PENSIONE ANTICIPATA','L\'ASSEGNO PARTE'],dk({sw:3.0,font:'bold 62px AB',w:1000,h:300}));
const t3=st.tag(['DI REGOLA, 3 MESI','DOPO I REQUISITI'],dk({sw:3.0,font:'bold 62px AB',w:1000,h:300,border:'#ff6b57'}));
const A=S.makeAnchor(st,KF);
const W=(t,a,b,c,d)=>eo(prog(t,a,b))*(1-eo(prog(t,c,d)));
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));S.moveBeach(scene,t);
  // casco (0 - 5,2): lavori gravosi + 30 anni
  const hI=.5+.5*eb(prog(t,.05,.6)),hO=eo(prog(t,5.0,5.5));hat.visible=hO<1;ped.visible=hO<1;hat.scale.setScalar(Math.max(.001,.5*hI*(1-hO)));ped.scale.setScalar(Math.max(.001,.6*hI*(1-hO)));hat.rotation.y=t*.9;hat.position.y=.95*.6+.55+Math.sin(t*2)*.03;
  const tI=eb(prog(t,3.4,4.2));tg.visible=t>3.3&&hO<1;tg.scale.setScalar(Math.max(.001,.7*tI*(1-hO)));tg.position.set(.75,.2,1.6);tiles.userData.set(30*eo(prog(t,3.4,5.0)),0xf3be3a,0xf3be3a);
  // nessun aumento (5,2 - 10,0)
  const sI=eb(prog(t,5.3,5.9)),sO=eo(prog(t,9.6,10.1));sNo.visible=t>5.2&&sO<1;sNo.scale.setScalar(Math.max(.001,.5*sI*(1-sO)));sNo.rotation.y=Math.sin(t*.9)*.08;
  const kI=eb(prog(t,8.1,8.7));ok.visible=t>8.0&&sO<1;ok.position.set(0,2.6,1.4);ok.scale.setScalar(Math.max(.001,.6*kI*(1-sO)));ok.rotation.y=Math.sin(t*3)*.3;
  // clessidra: la sabbia scende da 11,8 a 14,9 (tre mesi)
  const gI=eb(prog(t,10.1,10.8));hg.visible=t>10.0;hg.scale.setScalar(Math.max(.001,.62*gI));hg.position.set(0,.2,1.2);hg.rotation.y=Math.sin(t*.6)*.25;hg.userData.set(eo(prog(t,11.8,14.9)));
  mp.forEach((p,i)=>{const t0=12.7+i*1.0;const u=eo(prog(t,t0,t0+.5));p.visible=t>t0&&t<DUR+1;const x=(i-1)*.8;p.position.set(x,3.0-(1-u)*1.2+Math.sin(t*2+i)*.04,1.8);p.rotation.set(-.1,.15*(i-1),0);p.scale.setScalar(Math.max(.001,.3*u));});
  A(tEcc,t,.66,.66,W(t,.15,.5,1.3,1.6));
  A(tGra,t,.88,.64,W(t,1.5,1.85,5.0,5.3));
  A(tAlt,t,.88,.64,W(t,5.3,5.65,8.0,8.3));
  A(tNo,t,.66,.64,W(t,8.1,8.45,9.9,10.2));
  A(tAnt,t,.86,.64,W(t,10.1,10.45,13.6,13.9));
  A(t3,t,.86,.64,eo(prog(t,14.0,14.35)));
  st.render(t,{shakes:[8.1,12.7,13.7,14.7],flashes:[]});
}
boot(st,draw);
</script></body></html>
