<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#8fc4ea;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from '/code/lib/stage.js';
import * as S from '/code/lib/s007.js';
import * as S4 from '/code/lib/s004.js';
const dk=(o)=>Object.assign({bg:'rgba(18,38,63,.95)',border:'#f3be3a',fill:'#ffffff'},o);
const rd=(o)=>Object.assign({bg:'rgba(229,57,43,.97)',border:'#ffffff',fill:'#ffffff'},o);
const gn=(o)=>Object.assign({bg:'rgba(25,211,122,.97)',border:'#ffffff',fill:'#06222c'},o);
// ===== Short 007 - blocco 2: 300 mesi, circa 227.700 euro restituiti = 150.000 + circa 77.700 interessi; con le spese TAEG medio 4,05% (provvisorio) =====
const DUR=27.651;
const KF=[[0,[0,3.6,11.6],[0,2.2,0]],[DUR,[0,3.8,11.0],[0,2.3,0]]];
const st=await createStage({dur:DUR,centers:[],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
S.backdrop(scene,m);
const house=S.house(m);house.scale.setScalar(.7);house.position.set(-2.4,0,-3);scene.add(house);
const base=S.bar(m.blue,1.7,1.3);const top=S.bar(m.terra,1.7,1.3);const fee=S.bar(m.gold,1.7,1.3);scene.add(base.parent||base);scene.add(top);scene.add(fee);
base.position.set(.9,0,.2);top.position.set(.9,0,.2);fee.position.set(.9,0,.2);
const tM=st.tag(['300 MESI'],dk({sw:3.0,font:'bold 96px AB',w:780,h:200,border:'#19d37a'}));
const t227=st.tag(['CIRCA','227.700 €'],rd({sw:3.0,font:'bold 100px AB',w:860,h:310}));
const t150=st.tag(['150.000 €','RICEVUTI'],dk({sw:3.0,font:'bold 80px AB',w:860,h:300,border:'#2a6fdb'}));
const t77=st.tag(['+ CIRCA 77.700 €','DI INTERESSI'],rd({sw:3.0,font:'bold 72px AB',w:920,h:300}));
const tSpese=st.tag(['CON LE SPESE','IL COSTO SALE'],dk({sw:3.0,font:'bold 70px PM',w:900,h:290}));
const tTaeg=st.tag(['TAEG MEDIO'],dk({sw:3.0,font:'bold 84px AB',w:800,h:200,border:'#19d37a'}));
const tBce=S4.flagTag(st,'BANCA CENTRALE EUROPEA','EU',{border:'#f3be3a',sw:3.3,w:1000,h:180,font:'bold 46px PM',bg:'rgba(18,38,63,.95)'});
const c405=st.counter({w:760,h:260,sw:2.8,color:'#ffffff',border:'#f3be3a',font:'150px AB',bg:'rgba(18,38,63,.95)'});
const tProv=st.tag(['DATO PROVVISORIO'],dk({sw:3.0,font:'bold 62px PM',w:900,h:180}));
const A=S.makeAnchor(st,KF);
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));S.moveClouds(scene,t);
  house.rotation.y=.3+Math.sin(t*.5)*.05*damp;
  // colonna: base blu = 150.000 (3 unita), sopra terracotta = 77.700 (1,554 unita), poi oro = spese
  const gb=eo(prog(t,2.3,4.9));base.userData.set(3.0*gb);
  const gt=eo(prog(t,10.6,12.6));top.userData.set(1.554*gt,3.0);
  const gf=eo(prog(t,17.6,18.4));fee.userData.set(.45*gf,4.554);
  const pulse=1+.04*Math.sin(t*8);top.scale.x=(t>10.5&&t<14.4)?pulse:1;base.scale.x=(t>7.1&&t<10.2)?pulse:1;
  A(tM,t,.66,.64,eo(prog(t,.35,.7))*(1-eo(prog(t,1.9,2.2))));
  A(t227,t,.74,.62,eo(prog(t,2.4,2.75))*(1-eo(prog(t,6.6,6.9))));
  A(t150,t,.76,.62,eo(prog(t,7.0,7.35))*(1-eo(prog(t,10.1,10.35))));
  A(t77,t,.82,.62,eo(prog(t,10.45,10.8))*(1-eo(prog(t,14.3,14.6))));
  A(tSpese,t,.8,.62,eo(prog(t,16.1,16.45))*(1-eo(prog(t,19.4,19.6))));
  A(tTaeg,t,.7,.64,eo(prog(t,19.65,20.0))*(1-eo(prog(t,21.1,21.3))));
  A(tBce,t,.9,.64,eo(prog(t,21.2,21.55))*(1-eo(prog(t,23.5,23.7))));
  c405.userData.set('4,05 %');A(c405,t,.7,.6,eo(prog(t,23.65,24.0))*(1-eo(prog(t,26.0,26.2))),1+.04*Math.sin(t*8)*(t<26?1:0));
  A(tProv,t,.8,.64,eo(prog(t,26.15,26.5)));
  st.render(t,{shakes:[2.4,10.5],flashes:[]});
}
boot(st,draw);
</script></body></html>
