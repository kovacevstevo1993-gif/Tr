<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#cfe8f2;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from "/code/lib/stage.js";
import * as S from "/code/lib/s009.js";
const dk=(o)=>Object.assign({bg:"rgba(10,40,52,.95)",border:"#ffb347",fill:"#ffffff"},o);
const rd=(o)=>Object.assign({bg:"rgba(229,57,43,.97)",border:"#ffffff",fill:"#ffffff"},o);
const gn=(o)=>Object.assign({bg:"rgba(31,184,196,.97)",border:"#ffffff",fill:"#06222c"},o);
// ===== Short 009 - blocco 4: controlla gli anni di contributi nell'estratto conto INPS (Spid o CIE), solo informativo; fonte circolare INPS n. 28 del 16/03/2026; disclaimer; mi piace e iscriviti (22,01 s) =====
const DUR=22.01;
const KF=[[0,[0,2.6,8.4],[0,1.9,1]],[4.0,[-1.0,2.8,7.6],[0,1.9,1]],[8.5,[1.0,2.9,7.8],[0,1.9,1]],[12.5,[-.6,2.7,7.2],[0,1.9,1]],[16.5,[0,2.8,8.2],[0,1.9,1]],[DUR,[0,2.6,7.0],[0,2.2,1]]];
const st=await createStage({dur:DUR,centers:[],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
S.beach(scene,m);
const doc=S.statement();scene.add(doc);
const mag=new THREE.Group();const lens=new THREE.Mesh(new THREE.TorusGeometry(.5,.07,16,40),m.gold);mag.add(lens);const gl=new THREE.Mesh(new THREE.CircleGeometry(.48,32),new THREE.MeshStandardMaterial({color:0xcff3ff,transparent:true,opacity:.3,roughness:.1}));mag.add(gl);const hd=new THREE.Mesh(new THREE.CylinderGeometry(.06,.08,.9,12),m.woodD);hd.position.set(.45,-.5,0);hd.rotation.z=-.7;mag.add(hd);scene.add(mag);
const circ=S.sheet((c,W,H)=>{c.fillStyle='#fbfaf5';c.fillRect(0,0,W,H);c.fillStyle='#12303a';c.font='bold 44px AB';c.textAlign='center';c.textBaseline='middle';c.fillText('CIRCOLARE N. 28',W/2,100);c.fillStyle='#ff6b57';c.font='bold 36px PM';c.fillText('16 MARZO 2026',W/2,170);c.fillStyle='#c9cfda';for(let i=0;i<9;i++)c.fillRect(60,250+i*52,W-120-(i%3)*80,14);c.strokeStyle='#12303a';c.lineWidth=6;c.strokeRect(6,6,W-12,H-12);},520,740,2.6,null);scene.add(circ);
const heart=S.heart();scene.add(heart);const star=S.star();scene.add(star);
const tFar=st.tag(['COSA FARE'],dk({sw:3.0,font:'bold 92px AB',w:900,h:200,border:'#1fb8c4'}));
const tEst=st.tag(['ESTRATTO CONTO','DELL\'INPS'],dk({sw:3.0,font:'bold 72px AB',w:960,h:300}));
const tSp=st.tag(['CON SPID O CARTA','D\'IDENTITÀ ELETTRONICA'],dk({sw:3.0,font:'bold 58px AB',w:1000,h:300,border:'#1fb8c4'}));
const tInfo=st.tag(['VALORE SOLO','INFORMATIVO'],dk({sw:3.0,font:'bold 78px AB',w:900,h:300}));
const tDove=st.tag(['TI DICE','DOVE SEI'],gn({sw:3.0,font:'bold 82px AB',w:900,h:300}));
const tFon=st.tag(['FONTE: CIRCOLARE INPS','N. 28 · 16 MARZO 2026'],dk({sw:3.0,font:'bold 58px AB',w:1000,h:300,border:'#ffb347'}));
const tGen=st.tag(['INFORMAZIONE GENERALE','NON CONSULENZA'],dk({sw:3.0,font:'bold 60px AB',w:1000,h:300}));
const tLike=st.tag(['METTI MI PIACE'],dk({sw:3.0,font:'bold 88px AB',w:940,h:210,border:'#ff3b5c'}));
const tSub=st.tag(['ISCRIVITI A'],dk({sw:3.0,font:'bold 80px AB',w:760,h:190}));
const tName=st.tag(['SOLDI CHE','CONTANO'],{sw:3.0,font:'bold 112px AB',w:980,h:360,bg:'rgba(243,190,58,.98)',border:'#ffffff',fill:'#07222a'});
const A=S.makeAnchor(st,KF);
const W=(t,a,b,c,d)=>eo(prog(t,a,b))*(1-eo(prog(t,c,d)));
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));S.moveBeach(scene,t);
  // estratto conto + lente (0,8 - 11,0)
  const dI=.75+.25*eb(prog(t,.1,.8)),dO=eo(prog(t,10.9,11.5));doc.visible=dO<1;doc.position.set(0,1.85+Math.sin(t*1.5)*.05,1.6);doc.rotation.set(-.08,Math.sin(t*.7)*.15,Math.sin(t*1.1)*.02);doc.scale.setScalar(Math.max(.001,.46*dI*(1-dO)));
  const mI=eb(prog(t,2.6,3.2));mag.visible=t>2.5&&dO<1;mag.position.set(.25+Math.sin(t*1.3)*.18,1.6+Math.cos(t*1.7)*.12,2.4);mag.scale.setScalar(Math.max(.001,.55*mI*(1-dO)));
  // circolare INPS (11,2 - 15,8)
  const cI=eb(prog(t,11.3,11.9)),cO=eo(prog(t,15.6,16.1));circ.visible=t>11.2&&cO<1;circ.position.set(0,1.85+Math.sin(t*1.5)*.05,1.6);circ.rotation.set(-.08,Math.sin(t*.8)*.13,Math.sin(t*1.2)*.02);circ.scale.setScalar(Math.max(.001,.46*cI*(1-cO)));
  // cuore e stella (19,1 - fine)
  const hI=eb(prog(t,19.1,19.7)),hO=eo(prog(t,20.1,20.5));heart.visible=t>19.0&&hO<1;heart.position.set(0,2.0,1.6);heart.scale.setScalar(Math.max(.001,.5*hI*(1-hO)*(1+.08*Math.sin(t*7))));heart.rotation.y=Math.sin(t*1.5)*.5;
  const sI=eb(prog(t,20.3,20.9));star.visible=t>20.2;star.position.set(0,2.1,1.6);star.scale.setScalar(Math.max(.001,.55*sI*(1+.05*Math.sin(t*6))));star.rotation.y=t*1.3;
  A(tFar,t,.66,.72,W(t,.1,.45,1.2,1.5));
  A(tEst,t,.8,.66,W(t,1.35,1.7,4.6,4.9));
  A(tSp,t,.88,.64,W(t,4.8,5.15,7.5,7.8));
  A(tInfo,t,.66,.66,W(t,7.9,8.25,9.4,9.7));
  A(tDove,t,.66,.66,W(t,9.6,9.95,11.0,11.3));
  A(tFon,t,.9,.64,W(t,11.15,11.5,15.6,15.9));
  A(tGen,t,.88,.64,W(t,16.2,16.55,18.7,19.0));
  A(tLike,t,.78,.72,W(t,19.1,19.45,20.0,20.3));
  A(tSub,t,.6,.72,W(t,20.15,20.5,20.7,20.95));
  A(tName,t,.84,.62,eo(prog(t,20.75,21.1)),(1+(1-eb(prog(t,20.75,21.15)))*.1)*(1+.03*Math.sin(t*7)*damp));
  st.render(t,{shakes:[.05,19.1,20.8],flashes:[]});
}
boot(st,draw);
</script></body></html>
