<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#dff2ee;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 003 - blocco 1 (HOOK): il bollo auto potrebbe sparire, controlla il libretto =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from '/code/lib/stage.js';
import * as S from '/code/lib/s003.js';
const DUR=9.17;
const KF=[[0,[0,3.9,11.5],[0,2.8,0]],[1.7,[0,3.7,10.4],[0,2.9,0]],[3.8,[0,4.4,13.5],[0,2.4,0]],[4.8,[0,3.9,11.8],[0,3.0,0]],[DUR,[0,3.9,11.0],[0,3.0,0]]];
const st=await createStage({dur:DUR,centers:[0],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
const hero=S.car(m,m.teal);scene.add(hero);
const cols=[m.coral,m.sun,m.navy,m.teal,m.coral,m.sun];const crowd=[];
for(let i=0;i<6;i++){const c=S.car(m,cols[i]);const r=Math.floor(i/2),k=i%2;c.rotation.y=-Math.PI/2;c.position.set(k?1.4:-1.4,0,-3.2-r*3.2);c.scale.setScalar(.85);scene.add(c);crowd.push(c);}
const bill=S.sheet((g,W,H)=>{g.fillStyle='#fffaf0';g.fillRect(0,0,W,H);g.fillStyle='#ff6b4a';g.fillRect(0,0,W,120);g.fillStyle='#fff';g.font='bold 74px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('BOLLO AUTO',W/2,64);
  g.fillStyle='#17324d';g.font='bold 56px PM';g.fillText('DA PAGARE',W/2,230);g.fillStyle='#c9d3dc';for(let i=0;i<4;i++)g.fillRect(70,300+i*44,W-140-(i%2)*120,16);
  g.fillStyle='#17324d';for(let i=0;i<46;i++)g.fillRect(70+i*11,H-120,(i%3)+3,70);g.strokeStyle='#ff6b4a';g.lineWidth=10;g.strokeRect(5,5,W-10,H-10);},560,720,2.3,null);scene.add(bill);
const lib=S.libretto();scene.add(lib);
const dst=S.dust(240,0xff6b4a,.09);scene.add(dst);const dst2=S.dust(160,0xffc233,.08);scene.add(dst2);
const pill=(t,o)=>st.tag(t,Object.assign({bg:'rgba(255,255,255,.96)',border:'#17324d',fill:'#17324d',w:600},o));
const tBollo=pill(['BOLLO AUTO'],{border:'#ff6b4a',sw:2.9,font:'bold 62px PM',h:170});
const tMilioni=pill(['MILIONI DI AUTO'],{border:'#1f9d8a',sw:3.2,font:'bold 54px PM',h:160});
const tLib=pill(['SUL LIBRETTO'],{border:'#2b5aa8',sw:3.0,font:'bold 58px PM',h:160});
const cKw=st.counter({sw:3.0,w:720,h:300,font:'170px AB',color:'#ff6b4a',border:'#ff6b4a',bg:'rgba(255,255,255,.97)'});
const tMeno=pill(['O MENO'],{border:'#1f9d8a',sw:2.2,font:'bold 62px PM',h:160,fill:'#1f9d8a'});
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // auto principale
  const hp=eb(prog(t,.0,.35));hero.position.set(0,0,.4);hero.rotation.y=-.95+Math.sin(t*.7)*.05*damp+prog(t,0,4)*.25;hero.scale.setScalar(Math.max(.001,1.0*hp));
  // bolletta: schianto a 0.1, poi si dissolve a 'sparire'
  const bp=prog(t,.05,.4),be=bp>0?eb(bp):0;const gone=eo(prog(t,1.75,2.15));bill.visible=bp>0&&gone<.99;bill.position.set(0,3.5+Math.sin(t*1.6)*.06*damp+gone*1.2,2.8);bill.scale.setScalar(Math.max(.001,(1+(1-be)*1.8)*(1-gone)));bill.rotation.z=Math.sin(t*1.3)*.03*damp+gone*.4;
  dst.userData.update(1.75,t,0,3.9,2.8,2.0);dst2.userData.update(1.85,t,0,3.6,2.8,1.4);
  st.setSprite(tBollo,0,5.45,0,eo(prog(t,.4,.75))*(1-eo(prog(t,1.9,2.2))));
  // folla di auto = milioni
  crowd.forEach((c,i)=>{const p=prog(t,2.15+i*.2,2.15+i*.2+.4);c.visible=p>0;c.scale.setScalar(Math.max(.001,.85*eb(p)));});
  st.setSprite(tMilioni,0,5.45,0,eo(prog(t,2.35,2.75))*(1-eo(prog(t,3.8,4.1))));
  const cout=1-eo(prog(t,4.2,4.8));crowd.forEach(c=>{if(cout<1)c.scale.multiplyScalar(Math.max(.001,cout));});hero.scale.multiplyScalar(1);
  hero.position.x=-eo(prog(t,4.3,4.9))*0.0;hero.position.z=.4-eo(prog(t,4.3,4.9))*5.5;hero.visible=true;
  // libretto
  const lp=eio(prog(t,4.6,5.5));lib.visible=lp>0;lib.position.set(0,3.4+(1-lp)*(-4.5)+Math.sin(t*1.4)*.05*damp,3.0);lib.rotation.y=(1-lp)*.9+Math.sin(t*.9)*.04*damp;lib.scale.setScalar(Math.max(.001,.9+.1*lp));
  lib.userData.hl.material.opacity=.55*eo(prog(t,5.8,6.3))*(.75+.25*Math.sin(t*7)*damp);
  st.setSprite(tLib,0,5.45,0,eo(prog(t,4.9,5.3)));
  // 80 kW: il contatore scende da 200 a 80
  const kp=eio(prog(t,7.0,8.1));const v=Math.round(200-120*kp);cKw.userData.set(v+' kW');st.setSprite(cKw,0,2.0+Math.sin(t*2.4)*.05*damp,1.5,eo(prog(t,6.9,7.3)));
  st.setSprite(tMeno,0,.1+0,1.6,0);
  st.render(t,{shakes:[.12,1.75,8.1],flashes:[.12,8.1]});
}
boot(st,draw);
</script></body></html>
