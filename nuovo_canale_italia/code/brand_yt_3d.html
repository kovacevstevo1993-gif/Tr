<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#05070d;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Soldi che Contano - versione 2 (piu realistica): monete d'oro con bordo zigrinato, candele di borsa in vetro, skyline di notte, pavimento lucido con riflessi =====
import {THREE,createStage,boot,rnd} from '/code/lib/stage.js';
import {rbox} from '/code/lib/s002.js';
const W=window.innerWidth,H=window.innerHeight,WIDE=W/H>1.6;
const TH={bg:0x05070d,fogN:22,fogF:70,keyC:0xffe3b0,keyI:620,rimC:0x5aa0ff,rimI:25,hemiS:0x24324f,hemiG:0x05070d,hemiI:.45,floor:0x07090e,fR:.2,fM:.4,ring:0xffc857,ringK:0,env:1.1,expo:1.0,bloom:.22,flashK:.1,dustC:0xffe3b0,dustO:.35};
const KF=WIDE?[[0,[0,2.0,25.0],[0,1.7,0]],[4,[0,2.0,25.0],[0,1.7,0]]]:[[0,[.3,3.1,14.2],[.3,2.7,0]],[4,[.3,3.1,14.2],[.3,2.7,0]]];
const st=await createStage({dur:4,centers:[],kf:KF,theme:TH});
const {scene}=st;
// pavimento: scuro e semitrasparente, cosi si vedono i riflessi (oggetti specchiati sotto y=0)
scene.traverse(o=>{if(o.isMesh&&o.geometry&&o.geometry.type==='CircleGeometry'){o.material.color.set(0x020308);o.material.metalness=0;o.material.roughness=.85;o.material.transparent=true;o.material.opacity=.88;o.material.depthWrite=false;o.renderOrder=2;}});
// ----- sfondo: cielo notturno + skyline con finestre illuminate -----
{const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#03050a');gr.addColorStop(.55,'#0b1424');gr.addColorStop(1,'#2a2233');g.fillStyle=gr;g.fillRect(0,0,1024,512);
  const r=g.createRadialGradient(512,470,10,512,470,420);r.addColorStop(0,'rgba(255,190,110,.35)');r.addColorStop(1,'rgba(255,190,110,0)');g.fillStyle=r;g.fillRect(0,0,1024,512);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const bg=new THREE.Mesh(new THREE.PlaneGeometry(WIDE?120:70,WIDE?44:70),new THREE.MeshBasicMaterial({map:t,fog:false,toneMapped:false}));bg.position.set(0,8,-34);scene.add(bg);}
function windows(w,h,seed){const c=document.createElement('canvas');c.width=128;c.height=Math.round(128*h/w);const g=c.getContext('2d');g.fillStyle='#0b0f18';g.fillRect(0,0,c.width,c.height);
  for(let y=6;y<c.height-6;y+=10)for(let x=6;x<c.width-6;x+=10){const r=rnd(x*3+y*7+seed);if(r>.55){g.fillStyle=r>.9?'#ffe2a8':(r>.75?'#ffc46b':'#6a86b8');g.globalAlpha=.55+r*.4;g.fillRect(x,y,5,6);}}g.globalAlpha=1;const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
for(let i=0;i<(WIDE?34:18);i++){const w=2.2+rnd(i)*2.6,h=5+rnd(i+3)*(WIDE?14:12),x=(i-(WIDE?17:9))*(WIDE?3.6:3.7)+(rnd(i+9)-.5)*1.2,z=-24-rnd(i+5)*6;
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w*.8),new THREE.MeshBasicMaterial({map:windows(w*40,h*40,i*11),color:0x9aa6c4}));b.position.set(x,h/2,z);scene.add(b);}
// luci bokeh calde
for(let i=0;i<34;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:(()=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const r=g.createRadialGradient(32,32,2,32,32,30);r.addColorStop(0,'rgba(255,214,150,.9)');r.addColorStop(1,'rgba(255,214,150,0)');g.fillStyle=r;g.fillRect(0,0,64,64);const t=new THREE.CanvasTexture(c);return t;})(),transparent:true,opacity:.12+rnd(i+2)*.28,depthWrite:false,fog:false}));
  const sc=.35+rnd(i+8)*1.0;s.scale.set(sc,sc,1);s.position.set((rnd(i)-.5)*(WIDE?44:26),1+rnd(i+4)*9,-12-rnd(i+6)*8);scene.add(s);}
// ----- materiali -----
const gold=new THREE.MeshStandardMaterial({color:0xf2b838,metalness:1,roughness:.22});const goldD=new THREE.MeshStandardMaterial({color:0xc58f27,metalness:1,roughness:.32});
function reeds(){const c=document.createElement('canvas');c.width=512;c.height=32;const g=c.getContext('2d');g.fillStyle='#d9a02c';g.fillRect(0,0,512,32);for(let x=0;x<512;x+=5){g.fillStyle='#8c5f10';g.fillRect(x,0,2,32);g.fillStyle='#ffe7a0';g.fillRect(x+2,0,1,32);}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.RepeatWrapping;return t;}
const side=new THREE.MeshStandardMaterial({map:reeds(),metalness:1,roughness:.3});
function faceTex(){const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');const r=g.createRadialGradient(230,220,30,256,256,270);r.addColorStop(0,'#ffe9a8');r.addColorStop(.6,'#e8b23c');r.addColorStop(1,'#b97f1c');g.fillStyle=r;g.fillRect(0,0,512,512);
  g.strokeStyle='#a56d12';g.lineWidth=16;g.beginPath();g.arc(256,256,226,0,7);g.stroke();g.strokeStyle='#fff0b8';g.lineWidth=4;g.beginPath();g.arc(256,256,210,0,7);g.stroke();g.strokeStyle='#a56d12';g.lineWidth=5;g.beginPath();g.arc(256,256,184,0,7);g.stroke();
  for(let i=0;i<12;i++){const a=i/12*Math.PI*2;g.fillStyle='#a56d12';g.beginPath();g.arc(256+Math.cos(a)*205,256+Math.sin(a)*205,4,0,7);g.fill();}
  g.font='bold 320px Arial Black, Archivo Black, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#8a5a0e';g.fillText('€',258,282);g.fillStyle='#ffe9a8';g.fillText('€',252,274);g.fillStyle='#c48a1f';g.fillText('€',255,278);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;t.center.set(.5,.5);t.rotation=Math.PI/2;return t;}
const faceM=new THREE.MeshStandardMaterial({map:faceTex(),metalness:.95,roughness:.28});
const world=new THREE.Group();scene.add(world);
function coin(r,h){const g=new THREE.Group();const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,96),[side,faceM,faceM]);m.castShadow=true;g.add(m);
  [h/2,-h/2].forEach(y=>{const rim=new THREE.Mesh(new THREE.TorusGeometry(r*.985,h*.2,12,96),goldD);rim.rotation.x=Math.PI/2;rim.position.y=y;g.add(rim);});return g;}
function stack(n,r,x,z,seed){const g=new THREE.Group();for(let i=0;i<n;i++){const c=coin(r,.22);c.position.set((rnd(i+seed)-.5)*.12,.11+i*.24,(rnd(i+seed+5)-.5)*.12);c.rotation.y=rnd(i+seed+9)*6;g.add(c);}g.position.set(x,0,z);world.add(g);}
function standing(r,x,y,z,ry,tilt=0){const c=coin(r,.34);c.rotation.x=Math.PI/2;const g=new THREE.Group();g.add(c);g.rotation.y=ry;g.rotation.z=tilt;g.position.set(x,y,z);world.add(g);}
// candele di borsa
const up=new THREE.MeshStandardMaterial({color:0x16c46d,metalness:.2,roughness:.2,emissive:0x07502a,emissiveIntensity:.4,transparent:true,opacity:.95});
const dn=new THREE.MeshStandardMaterial({color:0xd8343a,metalness:.2,roughness:.2,emissive:0x5a0c10,emissiveIntensity:.35,transparent:true,opacity:.95});
const line=new THREE.MeshStandardMaterial({color:0xfff2cf,emissive:0xffe0a0,emissiveIntensity:.9,roughness:.3});
function candles(x0,step,n,base,slope,z){const pts=[];for(let i=0;i<n;i++){const mid=base+i*slope+(rnd(i*5+1)-.5)*.9;const body=.5+rnd(i+11)*.9;const isUp=rnd(i+21)>.2;const m=isUp?up:dn;const x=x0+i*step;
    const b=rbox(.5,body,.5,.06,m);b.position.set(x,mid,z);b.castShadow=true;world.add(b);const wk=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,body+.9+rnd(i+31)*.5,10),m);wk.position.set(x,mid,z);world.add(wk);pts.push([x,mid+body/2+.55,z+.25]);}
  const crv=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));const tube=new THREE.Mesh(new THREE.TubeGeometry(crv,80,.07,10,false),line);world.add(tube);
  const e=pts[pts.length-1],p=pts[pts.length-2];const dir=new THREE.Vector3(e[0]-p[0],e[1]-p[1],0).normalize();const cone=new THREE.Mesh(new THREE.ConeGeometry(.24,.6,24),line);cone.position.set(e[0]+dir.x*.3,e[1]+dir.y*.3,e[2]);cone.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);world.add(cone);}
if(WIDE){stack(11,1.1,-12.8,0,1);stack(6,1.0,-10.4,1.3,30);standing(1.55,-11.6,1.6,2.4,.35,.05);candles(8.6,.72,8,1.3,.55,0);}
else{standing(1.85,-1.0,1.95,1.8,.3,.05);stack(6,.85,2.7,2.4,7);candles(-.1,.85,6,2.6,.5,-1.5);}
// riflessi: copia specchiata sotto il pavimento
const mir=world.clone();mir.scale.y=-1;mir.position.y=-.012;scene.add(mir);
boot(st,(t)=>{st.render(1.0,{shakes:[],flashes:[]});});
</script></body></html>
