<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"AB";src:url("../brand/fonts/ArchivoBlack-Regular.ttf")}
@font-face{font-family:"PM";src:url("../brand/fonts/IBMPlexMono-Bold.ttf")}
@font-face{font-family:"PMm";src:url("../brand/fonts/IBMPlexMono-Medium.ttf")}
html,body{margin:0;padding:0;background:#101114;width:1080px;height:1920px;overflow:hidden}
svg{display:block}
</style></head><body>
<svg id="S" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
// ===== Short 001 - blocco 1 (gancio). Tutto dipende solo da t (secondi): draw(t) =====
const NS="http://www.w3.org/2000/svg", S=document.getElementById('S');
let P=S;
function el(tag,a={},parent){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);(parent||P).appendChild(e);return e;}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const DUR=9.81;
const PAPER="#F3F0E8",RED="#E32119",YEL="#FFE14A",GREY="#8A8F98",INK="#101114";

// ---- tempi dalla voce (secondi, da tempi.json) ----
const T={cart:0.42,spesa:1.08,sale:1.58,num:2.74,numEnd:3.55,ma:4.1,casa:5.0,qualcosa:5.6,costa:6.78,rise_end:7.35,terzo:7.46,pill:7.5,dico:8.94,circle_end:9.5};

const defs=el('defs');
function lg(id,stops,x2=0,y2=1){const g=el('linearGradient',{id,x1:0,y1:0,x2,y2},defs);stops.forEach(s=>el('stop',{offset:s[0],'stop-color':s[1],'stop-opacity':s[2]===undefined?1:s[2]},g));}
function rg(id,stops){const g=el('radialGradient',{id},defs);stops.forEach(s=>el('stop',{offset:s[0],'stop-color':s[1],'stop-opacity':s[2]},g));}
lg('gRed',[[0,'#FF5E50'],[.5,'#E32119'],[1,'#8E0E0B']]);
lg('gPaper',[[0,'#FFFFFF'],[1,'#CFC9B6']]);
lg('gVig',[[0,'#000',.55],[.25,'#000',0],[.75,'#000',0],[1,'#000',.65]]);
rg('gGlowY',[[0,YEL,.20],[1,YEL,0]]);
rg('gGlowR',[[0,RED,.18],[1,RED,0]]);
const fs=el('filter',{id:'sh',x:'-30%',y:'-30%',width:'160%',height:'160%'},defs);
el('feDropShadow',{dx:0,dy:16,stdDeviation:16,'flood-color':'#000','flood-opacity':.65},fs);
const fb=el('filter',{id:'blur',x:'-60%',y:'-60%',width:'220%',height:'220%'},defs);
el('feGaussianBlur',{stdDeviation:26},fb);
const pat=el('pattern',{id:'stripes',width:34,height:34,patternUnits:'userSpaceOnUse',patternTransform:'rotate(35)'},defs);
el('rect',{width:34,height:34,fill:'none'},pat);el('rect',{width:12,height:34,fill:'#fff','fill-opacity':.07},pat);

// ---- gruppi ----
const cam=el('g',{id:'cam'},S);P=cam;
el('rect',{x:-100,y:-100,width:1280,height:2120,fill:INK});
el('image',{href:'../brand/assets/scrivania.png',x:-1100,y:0,width:3389,height:1920,opacity:.42,preserveAspectRatio:'xMidYMid slice'});
const glowA=el('circle',{r:760,fill:'url(#gGlowY)'});
const glowB=el('circle',{r:820,fill:'url(#gGlowR)'});
el('rect',{x:-100,y:-100,width:1280,height:2120,fill:'url(#gVig)'});
// particelle: simboli grigi che salgono piano
const sym=['€','%','€','%','+','€'];const parts=[];
for(let i=0;i<20;i++){parts.push(el('text',{'font-family':'PM','font-size':30+rnd(i)*34,fill:GREY,opacity:.10+rnd(i+9)*.10,'text-anchor':'middle'},cam));parts[i].textContent=sym[i%sym.length];}
// griglia
const BASE=1230,LX=300,RX=780,BW=290,RH=800;
const grid=[];
const glab=[];
for(let k=1;k<=6;k++){grid.push(el('line',{x1:60,x2:1020,y1:BASE-k*120,y2:BASE-k*120,stroke:'#fff','stroke-opacity':.10,'stroke-width':2,'stroke-dasharray':'6 14'}));
  const tx=el('text',{x:64,y:BASE-k*120-10,'font-family':'PMm','font-size':26,fill:GREY});tx.textContent=(k*5)+'%';glab.push(tx);}
const baseLine=el('line',{x1:60,x2:1020,y1:BASE,y2:BASE,stroke:PAPER,'stroke-width':5,'stroke-linecap':'round'});

// intestazione
const hdr=el('g');
const dot=el('circle',{cx:78,cy:198,r:11,fill:RED},hdr);
el('text',{x:104,y:210,'font-family':'PM','font-size':34,fill:GREY,'letter-spacing':4},hdr).textContent='INFLAZIONE · ITALIA';
const pillH=el('g',{},hdr);
el('rect',{x:792,y:166,width:228,height:60,rx:30,fill:RED},pillH);
el('text',{x:906,y:208,'font-family':'PM','font-size':32,fill:'#fff','text-anchor':'middle','letter-spacing':2},pillH).textContent='OTT 2026';
const hline=el('line',{x1:60,x2:1020,y1:252,y2:252,stroke:PAPER,'stroke-opacity':.5,'stroke-width':3});
const src=el('text',{x:60,y:300,'font-family':'PMm','font-size':27,fill:GREY}); src.textContent='Fonte: ISTAT, stima provvisoria del 30/10/2026';

// barra sinistra (carrello)
const lbar=el('g');
const lrect=el('rect',{x:LX-BW/2,width:BW,rx:6,fill:'url(#gPaper)',filter:'url(#sh)'},lbar);
const lnum=el('text',{x:LX,'font-family':'AB','font-size':112,fill:PAPER,'text-anchor':'middle'});
// icona carrello
const cart=el('g');
el('path',{d:'M -60 -46 H -40 L -22 28 H 40',fill:'none',stroke:PAPER,'stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'},cart);
el('path',{d:'M -36 -26 H 56 L 43 16 H -25 Z',fill:'rgba(243,240,232,.18)',stroke:PAPER,'stroke-width':8,'stroke-linejoin':'round'},cart);
el('circle',{cx:-12,cy:52,r:10,fill:PAPER},cart);el('circle',{cx:32,cy:52,r:10,fill:PAPER},cart);
const lab1=el('g');
el('text',{x:LX,y:1446,'font-family':'PM','font-size':40,fill:PAPER,'text-anchor':'middle','letter-spacing':2},lab1).textContent='CARRELLO';
el('text',{x:LX,y:1494,'font-family':'PM','font-size':40,fill:PAPER,'text-anchor':'middle','letter-spacing':2},lab1).textContent='DELLA SPESA';

// sagoma tratteggiata destra
const ghost=el('g');
el('rect',{x:RX-BW/2,y:BASE-RH,width:BW,height:RH,rx:8,fill:'rgba(255,255,255,.03)',stroke:GREY,'stroke-width':4,'stroke-dasharray':'16 12'},ghost);
const gq=el('text',{x:RX,y:BASE-RH/2+70,'font-family':'AB','font-size':260,fill:GREY,'text-anchor':'middle',opacity:.55},ghost);gq.textContent='?';
// barra destra (casa tua)
const rbar=el('g');
const rglow=el('rect',{x:RX-BW/2,width:BW,fill:RED,filter:'url(#blur)',opacity:.55},rbar);
const rrect=el('rect',{x:RX-BW/2,width:BW,rx:6,fill:'url(#gRed)',filter:'url(#sh)'},rbar);
const rstr=el('rect',{x:RX-BW/2,width:BW,rx:6,fill:'url(#stripes)'},rbar);
const rshine=el('rect',{x:RX-BW/2+14,width:26,rx:13,fill:'#fff','fill-opacity':.18},rbar);
// copertura nera "+??%" (Contatore)
const cover=el('g');
el('rect',{x:RX-196,y:0,width:392,height:206,rx:14,fill:'#08080A',stroke:RED,'stroke-width':6,filter:'url(#sh)'},cover);
const cvt=el('text',{x:RX,y:140,'font-family':'PM','font-size':112,fill:RED,'text-anchor':'middle'},cover);cvt.textContent='+??%';
const cvLed=el('circle',{cx:RX+166,cy:26,r:8,fill:RED},cover);
// icona casa
const house=el('g');
el('path',{d:'M -62 2 L 0 -56 L 62 2',fill:'none',stroke:RED,'stroke-width':11,'stroke-linecap':'round','stroke-linejoin':'round'},house);
el('path',{d:'M -44 -8 V 52 H 44 V -8',fill:'rgba(243,240,232,.12)',stroke:PAPER,'stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'},house);
el('rect',{x:-11,y:16,width:22,height:36,rx:3,fill:PAPER},house);
el('rect',{x:20,y:6,width:16,height:16,rx:2,fill:YEL},house);
const lab2=el('text',{x:RX,y:1462,'font-family':'PM','font-size':40,fill:PAPER,'text-anchor':'middle','letter-spacing':2});lab2.textContent='IN CASA TUA';

// pillola gialla "un terzo in piu"
const pill=el('g');
el('rect',{x:-232,y:-76,width:464,height:152,rx:76,fill:YEL,filter:'url(#sh)'},pill);
el('circle',{cx:-150,cy:0,r:48,fill:'none',stroke:INK,'stroke-width':7},pill);
const slice=el('path',{fill:INK},pill);
el('text',{x:-84,y:-6,'font-family':'AB','font-size':42,fill:INK},pill).textContent='≈ UN TERZO';
el('text',{x:-84,y:44,'font-family':'AB','font-size':42,fill:INK},pill).textContent='IN PIÙ';
// cerchio a penna rossa
function roughEllipse(cx,cy,rx,ry){let d='';const N=90;for(let i=0;i<=N;i++){const a=-Math.PI*0.62+i/N*Math.PI*2.18;const k=1+0.035*Math.sin(a*3+1)+0.02*(i/N);const x=cx+Math.cos(a)*rx*k,y=cy+Math.sin(a)*ry*k;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';}return d;}
const pen=el('path',{d:roughEllipse(RX,0,226,142),fill:'none',stroke:RED,'stroke-width':9,'stroke-linecap':'round','stroke-linejoin':'round'});
const penLen=pen.getTotalLength();pen.setAttribute('stroke-dasharray',penLen);
const flash=el('rect',{x:-100,y:-100,width:1280,height:2120,fill:'#fff',opacity:0},S);

function fmt(v){return '+'+v.toFixed(1).replace('.',',')+'%';}
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));          // il movimento continuo si ferma negli ultimi fotogrammi
  const sh=(t>T.ma?8*Math.sin((t-T.ma)*95)*Math.exp(-(t-T.ma)*11):0)+(t>T.rise_end?7*Math.sin((t-T.rise_end)*90)*Math.exp(-(t-T.rise_end)*12):0);
  const z=1+0.035*eo(prog(t,0,DUR-0.05));
  cam.setAttribute('transform',`translate(${540+sh} 960) scale(${z}) translate(-540 -960)`);
  glowA.setAttribute('cx',230+90*Math.sin(t*.6)*damp);glowA.setAttribute('cy',330+60*Math.cos(t*.5)*damp);
  glowB.setAttribute('cx',880+80*Math.cos(t*.55)*damp);glowB.setAttribute('cy',1560+70*Math.sin(t*.45)*damp);
  parts.forEach((p,i)=>{const sp=16+rnd(i+3)*30;const y=((rnd(i+1)*2200-(t*sp*(0.4+0.6*damp+ (1-damp)*0)))%2200+2200)%2200-150;p.setAttribute('x',60+rnd(i+5)*960+8*Math.sin(t*.7+i)*damp);p.setAttribute('y',y);});
  // griglia + intestazione
  const g=eo(prog(t,0.02,0.6));
  grid.forEach((l,k)=>{l.setAttribute('x2',60+960*eo(prog(t,0.05+k*0.05,0.65+k*0.05)));});
  baseLine.setAttribute('x2',60+960*g);
  glab.forEach((e,k)=>e.setAttribute('opacity',eo(prog(t,0.1+k*0.06,0.6+k*0.06))*.8));
  hdr.setAttribute('opacity',eo(prog(t,0.0,0.4)));hdr.setAttribute('transform',`translate(0 ${-30*(1-eo(prog(t,0,0.4)))})`);
  dot.setAttribute('opacity',(Math.sin(t*7)>-.2||t>DUR-0.3)?1:.25);
  hline.setAttribute('x2',60+960*eo(prog(t,0.05,0.6)));
  src.setAttribute('opacity',eo(prog(t,0.3,0.8)));
  // carrello
  const cp=prog(t,T.cart,T.cart+0.5), cs=cp>0?eb(cp):0;
  cart.setAttribute('transform',`translate(${LX-(1-eo(cp))*420} ${1316+Math.sin(t*2.2)*5*damp}) scale(${1.15*cs||0.001})`);
  cart.setAttribute('opacity',cp>0?1:0);
  const l1=eo(prog(t,T.spesa,T.spesa+0.45));lab1.setAttribute('opacity',l1);lab1.setAttribute('transform',`translate(0 ${12*(1-l1)})`);
  // barra sinistra + conteggio
  const lh=60*eio(prog(t,T.sale+0.1,T.numEnd));
  lrect.setAttribute('y',BASE-lh);lrect.setAttribute('height',lh+2);lbar.setAttribute('opacity',lh>0.5?1:0);
  const lv=2.5*eo(prog(t,T.num-0.1,T.numEnd));
  lnum.setAttribute('y',BASE-lh-34+Math.sin(t*2.6)*3*damp);lnum.textContent=fmt(lv);lnum.setAttribute('opacity',eo(prog(t,T.num-0.15,T.num+0.1)));
  // sagoma "?" a "ma"
  const ga=eo(prog(t,T.ma,T.ma+0.5))*(1-eo(prog(t,T.qualcosa+0.6,T.rise_end)));
  ghost.setAttribute('opacity',ga*.9);gq.setAttribute('transform',`translate(0 ${Math.sin(t*3)*7*damp})`);
  // casa
  const hp=prog(t,T.casa,T.casa+0.5);
  house.setAttribute('transform',`translate(${RX} ${1316+Math.sin(t*2.0+1)*5*damp}) scale(${hp>0?1.15*eb(hp):0.001})`);house.setAttribute('opacity',hp>0?1:0);
  lab2.setAttribute('opacity',eo(prog(t,T.casa+0.3,T.casa+0.75)));
  // barra destra + copertura
  const rp=eio(prog(t,T.qualcosa,T.rise_end)); const rh=RH*rp;
  const top=BASE-rh;
  [rrect,rstr].forEach(e=>{e.setAttribute('y',top);e.setAttribute('height',rh+2);});
  rglow.setAttribute('y',top);rglow.setAttribute('height',rh);rglow.setAttribute('opacity',(.35+.2*Math.sin(t*5)*damp)*(rh>2?1:0));
  rshine.setAttribute('y',top+20);rshine.setAttribute('height',Math.max(0,rh-40));
  rbar.setAttribute('opacity',rh>1?1:0);
  const cy=top-44;
  const gl=(Math.floor(t*14)%2?3:-3)*damp;
  cover.setAttribute('transform',`translate(${gl} ${cy})`);cover.setAttribute('opacity',rh>40?eo(prog(rh,40,160)):0);
  cvLed.setAttribute('opacity',(Math.sin(t*9)>0||damp<.05)?1:.2);
  // pillola
  const pp=prog(t,T.pill,T.pill+0.5);
  pill.setAttribute('transform',`translate(300 ${690+Math.sin(t*2.4)*4*damp}) scale(${pp>0?eb(pp):0.001})`);pill.setAttribute('opacity',pp>0?1:0);
  const sa=prog(t,T.pill+0.1,T.pill+0.8)*120*Math.PI/180;
  const sx=-150+48*Math.sin(sa),sy=-48*Math.cos(sa);
  slice.setAttribute('d',`M -150 0 L -150 -48 A 48 48 0 ${sa>Math.PI?1:0} 1 ${sx.toFixed(2)} ${sy.toFixed(2)} Z`);
  // cerchio a penna rossa attorno al "+??%"
  const pr=eo(prog(t,T.dico,T.circle_end));
  pen.setAttribute('transform',`translate(0 ${cy+103})`);
  pen.setAttribute('stroke-dashoffset',penLen*(1-pr));pen.setAttribute('opacity',pr>0?1:0);
  // lampo a "ma"
  flash.setAttribute('opacity',t>T.ma?.16*Math.exp(-(t-T.ma)*14):0);
}
// controllo numerico dei limiti: ogni testo visibile dentro lo schermo
function bounds(){
  const bad=[];
  S.querySelectorAll('text').forEach(e=>{
    if(parts.includes(e))return;
    let o=1,n=e;while(n&&n!==S){const v=n.getAttribute&&n.getAttribute('opacity');if(v!==null&&v!==undefined)o*=+v;n=n.parentNode;}
    if(o<.05||!e.textContent.trim())return;
    const r=e.getBoundingClientRect();
    if(r.left<24||r.right>1056||r.top<110||r.bottom>1560)bad.push([e.textContent,Math.round(r.left),Math.round(r.right),Math.round(r.top),Math.round(r.bottom)]);
  });
  if(+pen.getAttribute('opacity')>0){const r=pen.getBoundingClientRect();if(r.left<24||r.right>1056||r.top<110)bad.push(['penna',Math.round(r.left),Math.round(r.right),Math.round(r.top),Math.round(r.bottom)]);}
  return bad;
}
window.draw=draw;window.bounds=bounds;window.DUR=DUR;
draw(0);
</script></body></html>
