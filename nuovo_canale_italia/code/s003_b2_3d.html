<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#c6ebe3;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 003 - blocco 2: manovra approvata il 28 ottobre, non ancora legge, bollo fino a 80 kW, campo P.2 =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from "/code/lib/stage.js";
import * as S from "/code/lib/s003.js";
const ap=(t,a,d=.5)=>eb(prog(t,a,a+d)),ou=(t,a,d=.45)=>1-eo(prog(t,a,a+d));
const fade=(t,a,b)=>eo(prog(t,a,a+.35))*(b?1-eo(prog(t,b,b+.35)):1);
const show=(o,s,t,a,b)=>{const k=ap(t,a)*(b?ou(t,b):1);o.visible=k>.002;o.scale.setScalar(Math.max(.001,s*k));return k;};
const DUR=24.29;
const KF=[[0,[0,4.0,10.6],[0,2.9,0]],[6.0,[0,3.9,10.1],[0,2.9,0]],[6.4,[0,4.2,11.2],[0,2.9,0],'w'],[10.4,[0,4.2,10.9],[0,2.9,0]],[10.9,[0,3.8,10.2],[0,2.7,0],'w'],[19.8,[0,3.9,9.8],[0,2.7,0]],[20.2,[0,3.7,9.6],[0,3.1,0],'w'],[DUR,[0,3.8,9.3],[0,3.1,0]]];
const st=await createStage({dur:DUR,centers:[0],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
const pill=(t,o)=>st.tag(t,Object.assign({bg:'rgba(255,255,255,.96)',border:'#17324d',fill:'#17324d',w:600},o));
// dossier MANOVRA
const dos=new THREE.Group();dos.add(S.rbox(2.3,1.7,.35,.12,m.navy));
const dl=S.sheet((g,W,H)=>{g.fillStyle='#17324d';g.fillRect(0,0,W,H);g.fillStyle='#ffc233';g.font='bold 70px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('MANOVRA',W/2,H*.38);g.fillText('2027',W/2,H*.64);g.strokeStyle='#ffc233';g.lineWidth=8;g.strokeRect(14,14,W-28,H-28);},460,340,2.0,null);dl.position.z=.2;dos.add(dl);scene.add(dos);
const cal=S.sheet((g,W,H)=>{g.fillStyle='#fffaf0';g.fillRect(0,0,W,H);g.fillStyle='#ff6b4a';g.fillRect(0,0,W,150);g.fillStyle='#fff';g.font='bold 92px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('OTTOBRE',W/2,80);g.fillStyle='#17324d';g.font='400 300px AB';g.fillText('28',W/2,H*.62);g.strokeStyle='#17324d';g.lineWidth=8;g.strokeRect(5,5,W-10,H-10);},560,620,1.5,null);scene.add(cal);
const parl=S.parliament(m);parl.scale.setScalar(.78);parl.position.set(0,0,-2.6);scene.add(parl);
const pencil=new THREE.Group();const pb=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,1.6,12),m.sun);pencil.add(pb);const pt=new THREE.Mesh(new THREE.ConeGeometry(.09,.26,12),m.cream);pt.position.y=-.93;pt.rotation.z=Math.PI;pencil.add(pt);const pe=new THREE.Mesh(new THREE.CylinderGeometry(.095,.095,.18,12),m.coral);pe.position.y=.88;pencil.add(pe);scene.add(pencil);
const car=S.car(m,m.teal);scene.add(car);const mo=S.moto(m);scene.add(mo);
const lib=S.libretto();scene.add(lib);const mag=S.magnifier(m);scene.add(mag);
const dst=S.dust(160,0xffc233,.08);scene.add(dst);
const tGov=pill(['IL GOVERNO'],{border:'#1f9d8a',sw:2.6,font:'bold 62px PM',h:160}),tLegge=pill(['NON ANCORA LEGGE'],{border:'#ff6b4a',sw:3.2,font:'bold 52px PM',h:150,fill:'#ff6b4a'}),tParl=pill(['PASSA AL PARLAMENTO'],{border:'#17324d',sw:3.4,font:'bold 46px PM',h:150}),tCamb=pill(['PUÒ CAMBIARLA'],{border:'#ffc233',sw:2.9,font:'bold 56px PM',h:160});
const tPerm=pill(['ESENZIONE PERMANENTE'],{border:'#25b36a',sw:3.1,font:'bold 40px PM',h:150}),t80=pill(['FINO A 80 kW'],{border:'#ff6b4a',sw:2.9,font:'bold 58px PM',h:160,fill:'#ff6b4a'}),t109=pill(['CIRCA 109 CV'],{border:'#1f9d8a',sw:2.9,font:'bold 58px PM',h:160,fill:'#1f9d8a'}),tMoto=pill(['E LE MOTO'],{border:'#17324d',sw:2.4,font:'bold 56px PM',h:150});
const tP2=pill(['CAMPO P.2'],{border:'#2b5aa8',sw:2.8,font:'bold 62px PM',h:160}),tCart=pill(["CARTA DI CIRCOLAZIONE"],{border:"#2b5aa8",sw:3.1,font:'bold 40px PM',h:140});
const cMld=st.counter({sw:3.1,w:720,h:260,font:'84px AB',color:'#1f9d8a',border:'#1f9d8a',bg:'rgba(255,255,255,.97)'});
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // A: dossier + calendario + 26 miliardi
  const kd=show(dos,1.15,t,1.9,10.6);const mv=eio(prog(t,7.9,9.2));dos.position.set(0,3.3-mv*1.4,1.8-mv*2.2);dos.rotation.y=-.2+Math.sin(t*1.1)*.05*damp;dos.rotation.x=mv*.25;
  show(cal,1,t,2.64,4.3);cal.position.set(0,5.1+Math.sin(t*1.4)*.05*damp,1.4);cal.rotation.z=Math.sin(t*1.2)*.03*damp;
  st.setSprite(tGov,0,5.0,0,fade(t,.4,2.5));
  const cv=Math.round(26*eio(prog(t,4.4,5.4)));cMld.userData.set(cv+' MILIARDI');st.setSprite(cMld,0,2.0+Math.sin(t*2)*.04*damp,0,fade(t,4.4,6.2));
  // B: non ancora legge -> Parlamento -> puo cambiarla
  st.setSprite(tLegge,0,5.0,0,fade(t,6.3,7.8));
  show(parl,.78,t,7.8,10.6);st.setSprite(tParl,0,5.0,0,fade(t,7.9,9.2));
  const pk=show(pencil,1,t,9.2,10.6);pencil.position.set(.9+Math.sin(t*5)*.18,3.9+Math.sin(t*3.3)*.12,1.6);pencil.rotation.z=.6+Math.sin(t*5)*.22;st.setSprite(tCamb,0,5.0,0,fade(t,9.3,10.6));
  // C: auto esente
  const kc=show(car,1,t,10.9,19.9);car.position.set(-eo(prog(t,18.5,19.0))*1.1,0,.3);car.rotation.y=-.95+Math.sin(t*.7)*.05*damp+prog(t,10.9,19.9)*.35;
  const km=show(mo,1,t,18.7,19.9);mo.position.set(1.55,0,.5);mo.rotation.y=-.7;if(kc>0&&t>18.5)car.scale.multiplyScalar(.82);
  st.setSprite(tPerm,0,5.0,0,fade(t,11.9,14.2));
  st.setSprite(t80,0,5.0,0,fade(t,14.9,16.6));st.setSprite(t109,0,5.0,0,fade(t,17.1,18.6));st.setSprite(tMoto,0,5.0,0,fade(t,18.7,19.9));
  dst.userData.update(11.1,t,0,2.2,.3,2.4);
  // D: libretto + lente su P.2
  const lp=eio(prog(t,20.0,20.9));lib.visible=lp>.002;lib.position.set(0,3.6+(1-lp)*(-4.5)+Math.sin(t*1.3)*.05*damp,2.4);lib.rotation.y=(1-lp)*.9;lib.scale.setScalar(Math.max(.001,lp));
  const mp=eio(prog(t,21.0,21.8));mag.visible=mp>.002;mag.position.set(.9-.3*mp+Math.sin(t*2)*.03*damp,4.9-1.55*mp,3.2);mag.scale.setScalar(Math.max(.001,1.0*ap(t,21.0,.4)));
  lib.userData.hl.material.opacity=.55*eo(prog(t,21.6,22.1))*(.75+.25*Math.sin(t*7)*damp);
  st.setSprite(tCart,0,5.0,0,fade(t,20.1,22.0));st.setSprite(tP2,0,5.0,0,fade(t,21.9,0));
  st.render(t,{shakes:[1.9,7.9,10.9,20.0],flashes:[]});
}
boot(st,draw);
</script></body></html>
