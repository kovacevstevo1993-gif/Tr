<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0c0f;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 002 - blocco 4: il successore (urna barrata, tavolo del Consiglio europeo, nessuna nomina, nomi sui giornali) =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd,RED,YEL,PAPER} from '/code/lib/stage.js';
import * as S from '/code/lib/s002.js';
const DUR=14.37;
const KF=[[0,[0,3.2,11.5],[0,2.4,0]],[3.3,[0,3.3,11.0],[0,2.4,0]],[3.6,[0,7.2,11.0],[0,1.0,0],'w'],[8.9,[0,6.8,10.4],[0,1.0,0]],[9.5,[0,3.4,11.5],[0,2.7,0],'w'],[DUR,[0,3.5,12.0],[0,3.0,0]]];
const st=await createStage({dur:DUR,centers:[0],kf:KF});
const {scene}=st;const m=S.mats();
// urna + X rossa
const urn=S.ballotBox(m);scene.add(urn);
const paperV=new THREE.Mesh(new THREE.BoxGeometry(.8,.02,.55),m.paper);scene.add(paperV);
const xa=new THREE.Mesh(new THREE.BoxGeometry(3.4,.3,.25),m.red);const xb=xa.clone();xa.rotation.z=.75;xb.rotation.z=-.75;[xa,xb].forEach(x=>{x.castShadow=true;scene.add(x);});
// tavolo rotondo con figure
const table=S.roundTable(m,12);scene.add(table);
const crown=new THREE.Group();
// poltrona vuota al centro del tavolo? no: sedia vuota dedicata davanti
const chair=S.chair(m);chair.scale.setScalar(.8);scene.add(chair);
// giornali
const papers=[];for(let i=0;i<3;i++){const s=S.sheet((g,W,H)=>{g.fillStyle='#EFEBDD';g.fillRect(0,0,W,H);g.fillStyle='#16181D';g.fillRect(30,30,W-60,60);g.fillStyle='#bbb5a2';for(let k=0;k<5;k++)g.fillRect(30,120+k*30,W-60-(k%2)*90,12);
  g.fillStyle='#16181D';g.textAlign='center';g.textBaseline='middle';g.font='bold 230px AB';g.fillText('?',W/2,H*.62);g.fillStyle='#bbb5a2';for(let k=0;k<3;k++)g.fillRect(30,H-120+k*30,W-60-(k%2)*120,12);g.strokeStyle='#8A8F98';g.lineWidth=6;g.strokeRect(4,4,W-8,H-8);},420,540,1.5,null);scene.add(s);papers.push(s);}
const tVote=st.tag(['NON LO VOTA','NESSUNO DI NOI'],{border:'#E32119',sw:3.2,font:'bold 52px PM'});
const tEu=st.tag(['CONSIGLIO EUROPEO'],{border:'#FFE14A',sw:3.6,font:'bold 56px PM',h:160});
const tCapi=st.tag(['CAPI DI STATO','E DI GOVERNO'],{sw:3.2,font:'bold 52px PM'});
const tNo=st.tag(['NESSUNA NOMINA'],{border:'#E32119',sw:3.4,font:'bold 56px PM',h:160,fill:'#FFE14A'});
const tNomi=st.tag(['SOLO NOMI SUI GIORNALI'],{sw:3.3,font:'bold 44px PM',h:150});
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // 1) urna con scheda e X rossa (0.3 - 3.2)
  const uo=1-eo(prog(t,3.2,3.65));const up=eb(prog(t,.15,.7));urn.visible=uo>.02;urn.position.set(0,.3,0);urn.scale.setScalar(Math.max(.001,1.0*up*uo));urn.rotation.y=-.35+Math.sin(t*1.1)*.08*damp+eio(prog(t,.2,3.2))*.5;
  const ph=prog(t,.7,1.5);paperV.visible=ph>0&&uo>.02;paperV.position.set(0,3.0-eio(ph)*1.1,0);paperV.rotation.y=urn.rotation.y;paperV.scale.setScalar(Math.max(.001,uo));
  const xp=eb(prog(t,1.9,2.4));[xa,xb].forEach(x=>{x.visible=xp>.001&&uo>.02;x.position.set(0,1.9,1.0);x.scale.setScalar(Math.max(.001,xp*uo));});
  st.setSprite(tVote,0,4.3,1.0,eo(prog(t,1.6,2.0))*uo);
  // 2) tavolo del Consiglio europeo (3.6 - 9.3)
  const tp=prog(t,3.5,4.2);const tout=1-eo(prog(t,9.2,9.6));table.visible=tp>0&&tout>.02;table.scale.setScalar(Math.max(.001,.8*eb(tp)*tout));table.rotation.y=t*.12;table.position.set(0,0,0);
  table.userData.seats.forEach((s,i)=>{const p=prog(t,6.0+i*.18,6.0+i*.18+.35);s.visible=p>0;s.scale.setScalar(Math.max(.001,eb(p)));});
  st.setSprite(tEu,0,3.2,-1.5,eo(prog(t,3.9,4.3))*(1-eo(prog(t,5.8,6.1)))*tout);
  st.setSprite(tCapi,0,3.2,-1.5,eo(prog(t,6.0,6.4))*tout);
  // 3) nessuna nomina: poltrona vuota (9.5 - ...) e giornali con ? che girano
  const cp=eb(prog(t,9.45,10.1));chair.visible=cp>.001;chair.position.set(0,0,0);chair.scale.setScalar(Math.max(.001,.8*cp));chair.rotation.y=Math.sin(t*1.0)*.15*damp;
  st.setSprite(tNo,0,1.35,1.6,eo(prog(t,9.7,10.1))*(1-eo(prog(t,11.4,11.8))));
  papers.forEach((s,i)=>{const p=prog(t,11.9+i*.35,12.5+i*.35);s.visible=p>0;const a=-1.0+i*1.0+Math.sin(t*.8+i)*.1*damp;s.position.set(a*1.15,3.6+Math.sin(t*1.5+i*2)*.12*damp+(i===1?.35:0),.7);s.rotation.z=-a*.12;s.scale.setScalar(Math.max(.001,eb(p)));});
  st.setSprite(tNomi,0,5.5,1.2,eo(prog(t,11.8,12.3)));
  st.render(t,{shakes:[.15,2.0,9.5],flashes:[.15,2.0]});
}
boot(st,draw);
</script></body></html>
