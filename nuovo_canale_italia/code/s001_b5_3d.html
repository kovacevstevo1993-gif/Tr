<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0c0f;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 001 - blocco 5 (3D): fumetto "scrivimi nei commenti" e bolletta =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd,RED,YEL,PAPER} from '/code/lib/stage.js';
const DUR=4.7;
const KF=[[0,[0,3.6,14.2],[0,3.3,0]],[DUR,[0,3.6,13.4],[0,3.3,0]]];
const st=await createStage({dur:DUR,centers:[0],kf:KF});
const {scene,mats}=st;
// fumetto 3D (rettangolo arrotondato con coda)
const bubble=new THREE.Group();
(function(){const w=4.0,h=2.1,r=.55,sh=new THREE.Shape();sh.moveTo(-w/2+r,-h/2);sh.lineTo(-.5,-h/2);sh.lineTo(-1.2,-h/2-.75);sh.lineTo(-1.45,-h/2);
  sh.lineTo(w/2-r,-h/2);sh.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);sh.lineTo(w/2,h/2-r);sh.quadraticCurveTo(w/2,h/2,w/2-r,h/2);sh.lineTo(-w/2+r,h/2);sh.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);sh.lineTo(-w/2,-h/2+r);sh.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  const g=new THREE.ExtrudeGeometry(sh,{depth:.35,bevelEnabled:true,bevelSize:.08,bevelThickness:.08,bevelSegments:4});g.translate(0,0,-.17);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:PAPER,roughness:.45,metalness:.05}));m.castShadow=true;bubble.add(m);})();
bubble.position.set(0,5.3,.4);bubble.visible=false;scene.add(bubble);
const dots=[0,1,2].map(i=>{const d=new THREE.Mesh(new THREE.SphereGeometry(.2,24,16),mats.dark);d.position.set(-.7+i*.7,0,.3);bubble.add(d);return d;});
// bolletta
const bill=new THREE.Group();
(function(){const c=document.createElement('canvas');c.width=512;c.height=672;const g=c.getContext('2d');g.fillStyle='#F3F0E8';g.fillRect(0,0,512,672);
  g.fillStyle='#16181D';g.fillRect(0,0,512,120);g.fillStyle='#F3F0E8';g.font='bold 64px PM';g.textAlign='left';g.textBaseline='middle';g.fillText('BOLLETTA',34,62);
  g.fillStyle='#16181D';g.font='bold 38px PM';g.fillText('LUCE E GAS',34,170);
  g.fillStyle='#bdb8a8';for(let i=0;i<6;i++){g.fillRect(34,215+i*36,i%3==2?250:444,12);}
  g.fillStyle='#E32119';g.font='bold 110px PM';g.fillText('? € ?',34,520);g.fillStyle='#16181D';g.font='bold 34px PM';g.fillText('TOTALE DA PAGARE',34,600);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
  const f=new THREE.Mesh(new THREE.BoxGeometry(2.3,3.0,.07),[mats.paper,mats.paper,mats.paper,mats.paper,new THREE.MeshStandardMaterial({map:t,roughness:.7}),mats.paper]);f.castShadow=true;bill.add(f);})();
bill.position.set(0,1.75,1.0);bill.visible=false;scene.add(bill);
// freccia rossa in su
const arrow=new THREE.Group();
(function(){const m=new THREE.MeshStandardMaterial({color:RED,emissive:RED,emissiveIntensity:.9,roughness:.4});const sh=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.9,20),m);sh.position.y=-.2;const hd=new THREE.Mesh(new THREE.ConeGeometry(.42,.6,24),m);hd.position.y=.55;arrow.add(sh,hd);})();
arrow.visible=false;scene.add(arrow);
// scritte
const qS=st.label((g,w,h)=>{g.fillStyle='#E32119';g.font='bold 190px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('+ ? %',w/2,h/2+10);},760,300,2.6,'+?%');
const tagC=st.tag(['NEI COMMENTI'],{sw:2.5,font:'bold 74px PM',border:'#FFE14A',h:170});
const tagB=st.tag(['ULTIMA BOLLETTA'],{sw:2.7,font:'bold 62px PM',h:170});
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // fumetto con tre puntini che "scrivono"
  const bp=prog(t,0,.5);bubble.visible=true;bubble.scale.setScalar(Math.max(.001,eb(bp)));bubble.position.y=4.85+Math.sin(t*2)*.08*damp;bubble.rotation.set(0,Math.sin(t*1.2)*.12*damp,Math.sin(t*1.5)*.02*damp);
  const typing=t<2.44;dots.forEach((d,i)=>{d.visible=typing;d.position.y=Math.max(0,Math.sin(t*9-i*.9))*.28;});
  st.setSprite(qS,0,4.9+Math.sin(t*2)*.08*damp,.9,eo(prog(t,2.44,2.8)),Math.max(.001,eb(prog(t,2.44,2.8))));
  st.setSprite(tagC,0,6.6,.8,eo(prog(t,1.02,1.4)));
  // bolletta
  const pp=prog(t,3.08,3.6);bill.visible=pp>0;bill.scale.setScalar(Math.max(.001,.75*eb(pp)));bill.rotation.set(-.08,-.18+Math.sin(t*1.3)*.05*damp,.03);bill.position.y=2.75+Math.sin(t*2.2)*.05*damp;
  const ap=prog(t,3.4,3.9);arrow.visible=ap>0;arrow.position.set(1.6,2.85+eo(ap)*.5+Math.sin(t*5)*.06*damp,1.3);arrow.scale.setScalar(Math.max(.001,eb(ap)));
  st.setSprite(tagB,0,1.2,1.4,eo(prog(t,3.82,4.2)));
  st.render(t,{shakes:[],flashes:[3.08]});
}
boot(st,draw);
</script></body></html>
