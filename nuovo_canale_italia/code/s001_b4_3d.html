<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0c0f;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 001 - blocco 4 (3D): luce mercato tutelato +60%, timbro "provvisorie", calendario 17 novembre =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd,RED,YEL,PAPER} from '/code/lib/stage.js';
const DUR=14.25;
const KF=[[0,[0.1,3.4,16.5],[0.1,2.8,0]],[3.8,[0.1,3.9,17.6],[0.1,3.4,0]],[6.6,[0.1,4.5,18.8],[0.1,3.9,0]],[7.9,[0.1,4.5,18.8],[0.1,3.9,0]],[8.45,[8.0,3.0,13.6],[8.0,2.5,0],'w'],[10.7,[8.0,3.0,13.6],[8.0,2.5,0]],[11.2,[8.0,3.1,13.4],[8.0,2.6,0]],[DUR,[8.0,3.1,12.9],[8.0,2.6,0]]];
const st=await createStage({dur:DUR,centers:[0,8],kf:KF});
const {scene,mats}=st;
const liqMat=new THREE.MeshStandardMaterial({color:0xA8100B,emissive:0xC4160F,emissiveIntensity:.45,roughness:.5});
const tLib=st.tank({x:-1.3,r:.58,H:5.0,color:liqMat});
const tTut=st.tank({x:1.5,r:.58,H:7.0,color:liqMat});
// documento ISTAT con timbro
const doc=new THREE.Group();
(function(){const c=document.createElement('canvas');c.width=512;c.height=672;const g=c.getContext('2d');g.fillStyle='#F3F0E8';g.fillRect(0,0,512,672);
  g.fillStyle='#16181D';g.fillRect(0,0,512,120);g.fillStyle='#F3F0E8';g.font='80px AB';g.textAlign='left';g.textBaseline='middle';g.fillText('ISTAT',34,64);
  g.fillStyle='#16181D';g.font='bold 40px PM';g.fillText('PREZZI AL CONSUMO',34,170);g.fillStyle='#E32119';g.font='bold 44px PM';g.fillText('OTTOBRE 2026',34,226);
  g.fillStyle='#bdb8a8';for(let i=0;i<7;i++){g.fillRect(34,280+i*34,i%3==2?250:444,12);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
  const front=new THREE.Mesh(new THREE.BoxGeometry(2.6,3.4,.07),[mats.paper,mats.paper,mats.paper,mats.paper,new THREE.MeshStandardMaterial({map:t,roughness:.7}),mats.paper]);front.castShadow=true;doc.add(front);})();
doc.visible=false;scene.add(doc);
// calendario da scrivania
const cal=new THREE.Group();
(function(){const c=document.createElement('canvas');c.width=512;c.height=576;const g=c.getContext('2d');g.fillStyle='#F3F0E8';g.fillRect(0,0,512,576);
  g.fillStyle='#E32119';g.fillRect(0,0,512,150);g.fillStyle='#fff';g.font='bold 78px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('NOVEMBRE',256,86);
  g.fillStyle='#16181D';g.font='330px AB';g.fillText('17',256,370);g.fillStyle='#8A8F98';g.font='bold 40px PM';g.fillText('2026',256,540);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.9,3.26,.3),[mats.paper,mats.paper,mats.paper,mats.paper,new THREE.MeshStandardMaterial({map:t,roughness:.6}),mats.dark]);body.castShadow=true;cal.add(body);
  for(let i=0;i<5;i++){const r=new THREE.Mesh(new THREE.TorusGeometry(.16,.035,10,24),mats.chrome);r.position.set(-1.1+i*.55,1.66,.12);cal.add(r);}
  const foot=new THREE.Mesh(new THREE.BoxGeometry(2.4,.12,1.0),mats.dark);foot.position.set(0,-1.7,-.2);cal.add(foot);})();
cal.position.set(8,2.2,.3);cal.visible=false;scene.add(cal);
const penMat=new THREE.MeshStandardMaterial({color:RED,emissive:RED,emissiveIntensity:1.1,roughness:.4});let penMesh=null;
// scritte
const tLibTag=st.tag(['LUCE','MERCATO LIBERO'],{sw:2.0,font:'bold 56px PM'});
const tTutTag=st.tag(['LUCE','MERCATO TUTELATO'],{sw:2.0,font:'bold 54px PM',border:'#E32119'});
const cLib=st.counter({sw:1.8}),cTut=st.counter({sw:1.9,border:'#E32119',color:'#FF4B3E'});
const stamp=st.label((g,w,h)=>{g.fillStyle='#2b0706';st.rr(g,10,10,w-20,h-20,26);g.fill();g.strokeStyle='#E32119';g.lineWidth=16;g.stroke();g.strokeStyle='#E32119';g.lineWidth=5;st.rr(g,34,34,w-68,h-68,14);g.stroke();
  g.fillStyle='#FF3B2F';g.font='bold 92px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('STIME',w/2,h*.35);g.fillText('PROVVISORIE',w/2,h*.68);},900,420,3.4,'timbro');
const tagDef=st.tag(['DATO DEFINITIVO'],{sw:2.7,font:'bold 62px PM',border:'#FFE14A',h:170});
const fmt=v=>'+'+v.toFixed(1).replace('.',',')+'%';
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // serbatoi
  const a=prog(t,0,.7);[tLib,tTut].forEach((k,i)=>{const p=prog(t,i*.25,i*.25+.7);k.g.visible=p>0;k.g.scale.set(1,Math.max(.001,eb(p)),1);});
  const lp=eio(prog(t,.25,1.2));tLib.set(3.2*lp);cLib.userData.set(fmt(32.0*lp));
  st.setSprite(cLib,-1.3,6.0+Math.sin(t*2.2)*.05*damp,.5,eo(prog(t,.8,1.2))*(1-eo(prog(t,8.0,8.3))));
  st.setSprite(tLibTag,-1.3,.62,.9,eo(prog(t,.4,.8))*(1-eo(prog(t,8.0,8.3))));
  st.setSprite(tTutTag,1.5,.62,.9,eo(prog(t,.95,1.35))*(1-eo(prog(t,8.0,8.3))));
  const up=eio(prog(t,4.0,6.85));tTut.set(6.02*up);cTut.userData.set(fmt(60.2*up));
  st.setSprite(cTut,1.5,7.9+Math.sin(t*2.3)*.05*damp,.5,eo(prog(t,4.2,4.6))*(1-eo(prog(t,8.0,8.3))));
  // documento + timbro
  const dp=eo(prog(t,8.0,8.6));doc.visible=t>=8.0&&t<11.4;doc.position.set(8+(t>10.7?eo(prog(t,10.7,11.3))*7:0),2.2,.8);doc.rotation.set(0,-.25+(1-dp)*1.2,-.04+(t>10.7?eo(prog(t,10.7,11.3))*-.6:0));doc.scale.setScalar(Math.max(.001,1.15*dp));
  const sp=prog(t,9.14,9.46);const sc=sp>0?1+(1-eo(sp))*1.6:0;stamp.material.rotation=-.22;
  st.setSprite(stamp,8.0,2.55,1.3,(t>=9.14&&t<10.75)?1:(t>=10.75?1-eo(prog(t,10.75,11.1)):0),Math.max(.001,sc*.82));
  // calendario
  const cp=prog(t,10.94,11.5);cal.visible=cp>0;cal.scale.setScalar(Math.max(.001,1.1*eb(cp)));cal.rotation.y=-.12*(1-cp)+Math.sin(t*1.4)*.04*damp;
  st.setSprite(tagDef,8.0,5.0+Math.sin(t*2.1)*.04*damp,.8,eo(prog(t,11.36,11.8)));
  if(penMesh){scene.remove(penMesh);penMesh.geometry.dispose();penMesh=null;}
  const pr=eo(prog(t,12.86,13.5));
  if(pr>.02){const pts=[],N=60,span=Math.PI*2*1.04*pr;for(let i=0;i<=N;i++){const an=-Math.PI*.55+i/N*span;const k=1+.03*Math.sin(an*3);pts.push(new THREE.Vector3(Math.cos(an)*1.0*k,Math.sin(an)*1.15*k,0));}
    penMesh=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),80,.05,10,false),penMat);penMesh.position.set(8.0,2.0,.9);scene.add(penMesh);}
  st.render(t,{shakes:[6.85,9.14,12.86],flashes:[6.85,9.14]});
}
boot(st,draw);
</script></body></html>
