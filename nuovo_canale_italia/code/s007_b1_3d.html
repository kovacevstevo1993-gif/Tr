<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#8fc4ea;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from '/code/lib/stage.js';
import * as S from '/code/lib/s007.js';
import * as S4 from '/code/lib/s004.js';
const dk=(o)=>Object.assign({bg:'rgba(18,38,63,.95)',border:'#f3be3a',fill:'#ffffff'},o);
const rd=(o)=>Object.assign({bg:'rgba(229,57,43,.97)',border:'#ffffff',fill:'#ffffff'},o);
const gn=(o)=>Object.assign({bg:'rgba(25,211,122,.97)',border:'#ffffff',fill:'#06222c'},o);
// ===== Short 007 - blocco 1: (0-3,8 s hook Blender) rata 759 euro, mutuo 150.000 euro, 25 anni, tasso medio BCE settembre 3,60%, quanto restituisci davvero =====
const DUR=20.211;
const KF=[[0,[0,2.9,11.5],[0,1.6,0]],[3.8,[0,2.9,11.5],[0,1.6,0]],[DUR,[0,3.1,10.2],[0,1.9,0]]];
const st=await createStage({dur:DUR,centers:[],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
S.backdrop(scene,m);
const house=S.house(m);house.scale.setScalar(1.15);house.position.set(0,0,-1.5);scene.add(house);
const ct=S.contract();scene.add(ct);const pen=S.pen(m);scene.add(pen);
const tRata=st.tag(['LA RATA'],dk({sw:3.0,font:'bold 80px AB',w:760,h:190}));
const t150=st.tag(['MUTUO DA','150.000 €'],dk({sw:3.0,font:'bold 92px AB',w:860,h:300}));
const t25=st.tag(['25 ANNI'],dk({sw:3.0,font:'bold 100px AB',w:760,h:200,border:'#19d37a'}));
const tMedio=st.tag(['TASSO MEDIO','DELLE BANCHE'],dk({sw:3.0,font:'bold 70px PM',w:900,h:290}));
const tSet=st.tag(['SETTEMBRE 2026'],dk({sw:3.0,font:'bold 66px PM',w:880,h:180}));
const tBce=S4.flagTag(st,'BANCA CENTRALE EUROPEA','EU',{border:'#f3be3a',sw:3.3,w:1000,h:180,font:'bold 46px PM',bg:'rgba(18,38,63,.95)'});
const c360=st.counter({w:760,h:260,sw:2.8,color:'#ffffff',border:'#f3be3a',font:'150px AB',bg:'rgba(18,38,63,.95)'});
const tQ=st.tag(['QUANTO','RESTITUISCI','DAVVERO?'],rd({sw:3.0,font:'bold 80px AB',w:900,h:420}));
const A=S.makeAnchor(st,KF);
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));S.moveClouds(scene,t);
  house.position.y=0;house.rotation.y=Math.sin(t*.5)*.05*damp;
  const hs=1.15*Math.max(.001,eb(prog(t,3.6,4.3)));house.scale.setScalar(hs);
  // contratto con la penna (dal 3,8 al 8,4)
  ct.visible=t>3.9;ct.position.set(0,1.55,1.5);ct.rotation.set(-.15,Math.sin(t*.6)*.06,0);ct.scale.setScalar(Math.max(.001,.55*eb(prog(t,4.0,4.5))*(1-eo(prog(t,8.4,8.9)))));
  pen.visible=ct.visible&&t<8.9;pen.position.set(1.2+Math.sin(t*3)*.08,1.3,2.0);pen.rotation.set(0,0,.6);pen.scale.setScalar(Math.max(.001,ct.scale.x/.55));
  A(tRata,t,.66,.64,eo(prog(t,3.8,4.15))*(1-eo(prog(t,5.0,5.25))));
  A(t150,t,.74,.6,eo(prog(t,5.1,5.45))*(1-eo(prog(t,6.7,6.95))));
  A(t25,t,.66,.64,eo(prog(t,6.8,7.15))*(1-eo(prog(t,8.0,8.25))));
  A(tMedio,t,.8,.6,eo(prog(t,8.3,8.65))*(1-eo(prog(t,10.9,11.1))));
  A(tSet,t,.78,.64,eo(prog(t,11.0,11.35))*(1-eo(prog(t,12.2,12.45))));
  A(tBce,t,.9,.64,eo(prog(t,12.4,12.75))*(1-eo(prog(t,14.3,14.5))));
  c360.userData.set('3,60 %');A(c360,t,.7,.6,eo(prog(t,14.45,14.8))*(1-eo(prog(t,16.5,16.7))),1+.04*Math.sin(t*8)*(t<16.5?1:0));
  A(tQ,t,.8,.58,eo(prog(t,16.7,17.05)),(1+(1-eb(prog(t,16.7,17.1)))*.1)*(1+.03*Math.sin(t*7)*damp));
  st.render(t,{shakes:[16.7],flashes:[]});
}
boot(st,draw);
</script></body></html>
