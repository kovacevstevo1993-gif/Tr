<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0a1f27;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from "/code/lib/stage.js";
import * as S from "/code/lib/s008.js";
const dk=(o)=>Object.assign({bg:"rgba(8,36,44,.96)",border:"#ffb347",fill:"#ffffff"},o);
const rd=(o)=>Object.assign({bg:"rgba(229,57,43,.97)",border:"#ffffff",fill:"#ffffff"},o);
// ===== Short 008 - blocco 4: controlla le fasce del canone concordato del tuo comune; meno di 36 anni puoi proporlo al proprietario; dati dal testo in bozza riportato dalla stampa; info generale; mi piace e iscriviti =====
const DUR=19.752;
const KF=[[0,[0,5.2,9.0],[0,.8,0]],[4.0,[2.0,4.6,8.0],[0,1.0,0]],[8.8,[-1.6,3.2,8.4],[0,2.6,0]],[12.4,[1.6,3.4,8.6],[0,2.8,0]],[16.2,[0,3.2,9.0],[0,2.8,0]],[DUR,[0,3.0,8.4],[0,3.0,0]]];
const st=await createStage({dur:DUR,centers:[],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
S.furnish(scene,m);
// mappa del comune: lastra con casette e pin
const town=new THREE.Group();const plate=new THREE.Mesh(new THREE.BoxGeometry(3.6,.15,5.4),new THREE.MeshStandardMaterial({color:0x4f9a5a,roughness:.9}));plate.position.y=.08;plate.receiveShadow=true;town.add(plate);
[[-.9,-2],[.9,-2],[-.9,-.7],[.9,-.7],[-.9,.6],[.9,.6],[-.9,1.9],[.9,1.9]].forEach(([x,z],i)=>{const h=S.townHouse(m,i%2?0xe9d9b8:0xf2c79a,i%3?0xb5482a:0x8a3a2a);h.position.set(x,.15,z);h.scale.setScalar(.75);town.add(h);});
const road=new THREE.Mesh(new THREE.BoxGeometry(.5,.02,5.4),new THREE.MeshStandardMaterial({color:0x3a3f46,roughness:.9}));road.position.set(0,.17,0);town.add(road);
town.position.set(0,0,.4);scene.add(town);
const pin=S.pin();scene.add(pin);
const kT=S.keychain(m,'AFFITTO','#2fe0a0');scene.add(kT);
const lease=S.lease('CONTRATTO DI LOCAZIONE','CANONE CONCORDATO');scene.add(lease);
const ok=S.check();scene.add(ok);
const news=[S.paper('MANOVRA 2027'),S.paper('CEDOLARE SECCA'),S.paper('AFFITTI')];news.forEach(p=>scene.add(p));
const heart=S.heart();scene.add(heart);
const tFas=st.tag(['CONTROLLA LE FASCE','DEL TUO COMUNE'],dk({sw:3.0,font:'bold 74px AB',w:960,h:300,border:'#2fe0a0'}));
const tMen=st.tag(['HAI MENO','DI 36 ANNI?'],dk({sw:3.0,font:'bold 84px AB',w:900,h:300}));
const tPro=st.tag(['PROPONI IL','CANONE CONCORDATO'],dk({sw:3.0,font:'bold 72px AB',w:960,h:300,border:'#2fe0a0'}));
const tBoz=st.tag(['DAL TESTO IN BOZZA','DELLA MANOVRA'],dk({sw:3.0,font:'bold 68px AB',w:980,h:300}));
const tStampa=st.tag(['RIPORTATO DALLA','STAMPA SPECIALIZZATA'],dk({sw:3.0,font:'bold 64px AB',w:980,h:300,border:'#2fe0a0'}));
const tInfo=st.tag(['INFORMAZIONE GENERALE','NON CONSULENZA'],dk({sw:3.0,font:'bold 60px AB',w:980,h:300}));
const tLike=st.tag(['METTI MI PIACE'],dk({sw:3.0,font:'bold 88px AB',w:940,h:210,border:'#ff3b5c'}));
const tSub=st.tag(['ISCRIVITI A'],dk({sw:3.0,font:'bold 80px AB',w:760,h:190}));
const tName=st.tag(['SOLDI CHE','CONTANO'],{sw:3.0,font:'bold 112px AB',w:980,h:360,bg:'rgba(243,190,58,.98)',border:'#ffffff',fill:'#07222a'});
const A=S.makeAnchor(st,KF);
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));S.liveRoom(scene,t);
  // mappa (0-4,2)
  const tw=eb(prog(t,.0,.5))*(1-eo(prog(t,3.9,4.4)));town.visible=tw>.002;town.scale.setScalar(Math.max(.001,tw));town.rotation.y=.35+Math.sin(t*.6)*.1;
  const pd=eo(prog(t,1.6,2.1));pin.visible=t>1.5&&tw>.002;pin.position.set(.9*tw,.4+(1-pd)*4+Math.abs(Math.sin(t*3))*.05*pd,.4+.6);pin.scale.setScalar(Math.max(.001,.7*tw));pin.rotation.y=t*1.5;
  // chiavi che passano dal inquilino al proprietario (4,2 - 9,2)
  const kk=eb(prog(t,4.2,4.8)),kko=eo(prog(t,9.0,9.5));kT.visible=t>4.1&&kko<1;const arc=eio(prog(t,7.3,8.9));
  kT.position.set(1.0-2.0*arc,2.0+Math.sin(arc*3.14)*1.4+Math.sin(t*2)*.05,.2);kT.scale.setScalar(Math.max(.001,.62*kk*(1-kko)));kT.rotation.set(0,Math.sin(t*1.4)*.4,-arc*.6);
  lease.visible=(t>4.1&&kko<1)||(t>13.4&&t<16.4);const lz=t>13?1:0;lease.position.set(lz?-.5:-.55,lz?1.8:1.5+Math.sin(t*1.3)*.05,.6);lease.rotation.set(-.1,.15,0);lease.scale.setScalar(Math.max(.001,.4*(lz?eb(prog(t,13.4,14.0))*(1-eo(prog(t,16.0,16.4))):eb(prog(t,4.4,5.0))*(1-kko))));
  ok.visible=(t>8.9&&t<9.6)||(t>13.5&&t<16.3);const okA=(t>13)?eb(prog(t,13.5,14.0))*(1-eo(prog(t,16.0,16.3))):eb(prog(t,8.9,9.3))*(1-eo(prog(t,9.3,9.6)));ok.position.set(t>13?.6:-.55,t>13?2.6:3.1,.8);ok.scale.setScalar(Math.max(.001,.7*okA));ok.rotation.y=t>13?t*1.6:0;
  // giornali (9-13,4): si sfogliano
  news.forEach((p,i)=>{const cin=eb(prog(t,9.0+i*.25,9.6+i*.25)),cout=eo(prog(t,13.4,13.9));p.visible=t>9.0+i*.25&&cout<1;p.position.set(-.2+i*.22,2.2+i*.12+Math.sin(t*1.5+i)*.05,.3-i*.12);p.rotation.set(-.1,Math.sin(t*.8+i)*.15,-.12+i*.1);p.scale.setScalar(Math.max(.001,.46*cin*(1-cout)));});
  // cuore (16,2-fine)
  const hb=1+.08*Math.sin(t*6)*(t>16.2?1:0);const hi=eb(prog(t,16.2,16.8));heart.visible=t>16.1;heart.position.set(0,1.6,.4);heart.scale.setScalar(Math.max(.001,.7*hi*hb));heart.rotation.y=Math.sin(t*1.4)*.5;
  A(tFas,t,.8,.64,eo(prog(t,.4,.75))*(1-eo(prog(t,3.7,3.95))));
  A(tMen,t,.7,.66,eo(prog(t,4.1,4.45))*(1-eo(prog(t,7.1,7.35))));
  A(tPro,t,.8,.64,eo(prog(t,7.4,7.75))*(1-eo(prog(t,8.8,9.05))));
  A(tBoz,t,.82,.64,eo(prog(t,9.0,9.35))*(1-eo(prog(t,11.1,11.35))));
  A(tStampa,t,.82,.64,eo(prog(t,11.3,11.65))*(1-eo(prog(t,13.3,13.55))));
  A(tInfo,t,.82,.64,eo(prog(t,13.45,13.8))*(1-eo(prog(t,16.0,16.25))));
  A(tLike,t,.78,.72,eo(prog(t,16.3,16.65))*(1-eo(prog(t,17.75,18.0))));
  A(tSub,t,.6,.72,eo(prog(t,17.7,18.05))*(1-eo(prog(t,18.4,18.65))));
  A(tName,t,.84,.6,eo(prog(t,18.5,18.85)),(1+(1-eb(prog(t,18.5,18.9)))*.1)*(1+.03*Math.sin(t*7)*damp));
  st.render(t,{shakes:[2.0,8.9,16.3,18.5],flashes:[]});
}
boot(st,draw);
</script></body></html>
