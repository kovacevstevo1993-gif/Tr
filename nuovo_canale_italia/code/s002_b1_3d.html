<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b0c0f;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
// ===== Short 002 - blocco 1 (HOOK): la poltrona vuota =====
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd,RED,YEL,PAPER} from '/code/lib/stage.js';
import * as S from '/code/lib/s002.js';
const DUR=11.37;
const KF=[[0,[0,3.4,12.5],[0,3.6,0]],[1.7,[0,3.3,10.8],[0,3.6,0]],[3.0,[0,3.4,11.8],[0,3.6,0],'w'],[4.2,[0,3.2,14.5],[0,2.8,0]],[8.9,[.2,3.2,14.2],[0,2.8,0]],[9.6,[0,3.5,12.5],[0,3.4,0]],[DUR,[0,3.4,11.0],[0,3.4,0]]];
const st=await createStage({dur:DUR,centers:[0],kf:KF});
const {scene}=st;const m=S.mats();
const chair=S.chair(m);scene.add(chair);
const fig=S.figure(m);scene.add(fig);
const board=S.sheet((g,W,H)=>{g.fillStyle='#14161b';g.fillRect(0,0,W,H);g.fillStyle='#E32119';g.fillRect(0,0,W,150);g.fillStyle='#F3F0E8';g.font='bold 96px PM';g.textAlign='center';g.textBaseline='middle';g.fillText('FEBBRAIO',W/2,78);
  g.fillStyle='#FFE14A';g.font='400 330px AB';g.fillText('7',W/2,H*.60);g.fillStyle='#8A8F98';g.font='bold 74px PM';g.fillText('2027',W/2,H*.9);g.strokeStyle='#F3F0E8';g.lineWidth=10;g.strokeRect(5,5,W-10,H-10);},640,760,2.4,null);
scene.add(board);
const house=S.house(m);house.position.set(-1.95,0,0);scene.add(house);
const card=S.card(m);card.position.set(1.95,1.0,0);card.rotation.y=-.35;scene.add(card);
const cardBase=new THREE.Mesh(new THREE.CylinderGeometry(1.1,1.3,.2,32),m.dark);cardBase.position.set(1.95,.1,0);scene.add(cardBase);
const q=S.question(m);scene.add(q);
const dst=S.dust();scene.add(dst);
// raggi dorati dalla poltrona
const mkRay=(x1)=>{const g=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1,8),m.gold);scene.add(g);g.userData.x=x1;return g;};
const rayL=mkRay(-1.95),rayR=mkRay(1.95);
function setRay(r,p){const x=r.userData.x,y0=3.0,y1=1.5;const dx=x,dy=y1-y0;const len=Math.hypot(dx,dy)*p;r.visible=p>0.01;r.scale.set(1,Math.max(.001,len),1);
  const ang=Math.atan2(dx,dy);r.rotation.z=-ang;const cx=dx/2*p,cy=y0+dy/2*p;r.position.set(cx,cy,.4);}
const tBce=st.tag(['BANCA CENTRALE','EUROPEA'],{border:'#FFE14A',sw:3.4,font:'bold 54px PM'});
const tTassi=st.tag(['TASSI'],{border:'#E32119',sw:2.8,font:'bold 96px PM',h:200,fill:'#FFE14A'});
const tMutui=st.tag(['MUTUI'],{sw:1.45,font:'bold 70px PM',h:170});
const tPrest=st.tag(['PRESTITI'],{sw:1.6,font:'bold 70px PM',h:170});
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  // tavola data: schianto a 0.12
  const bp=prog(t,.05,.45),be=bp>0?eb(bp):0;board.visible=bp>0;const bout=1-eo(prog(t,3.5,4.0));
  board.position.set(0,5.15+Math.sin(t*1.6)*.05*damp,.6);board.scale.setScalar(Math.max(.001,(1.0+(1-be)*2.0)*bout));board.rotation.z=Math.sin(t*1.2)*.02*damp;
  // poltrona: gira da sola dopo che la figura sparisce
  const sp=eio(prog(t,2.0,3.4));chair.rotation.y=-.5+sp*(Math.PI*2+.5)+Math.sin(t*.8)*.06*damp*prog(t,3.4,4);
  // figura: si alza e si dissolve
  const fup=eio(prog(t,1.55,2.2)),fgone=eo(prog(t,2.2,2.7));fig.visible=fgone<.99;fig.position.set(0,2.0+fup*.55,.05);fig.scale.setScalar(Math.max(.001,1-fgone));fig.rotation.y=fup*.3;
  dst.userData.update(2.15,t,0,2.4,0);
  // nome sotto la poltrona
  st.setSprite(tBce,0,1.0,1.6,eo(prog(t,4.7,5.1))*(1-eo(prog(t,6.0,6.3))));
  // raggi, casa, carta
  const tp=eo(prog(t,6.2,6.55));st.setSprite(tTassi,0,5.0+Math.sin(t*3)*.05*damp,1.0,tp*(1-eo(prog(t,8.9,9.3))));
  setRay(rayL,eio(prog(t,6.9,7.6)));setRay(rayR,eio(prog(t,7.6,8.3)));
  const hp=prog(t,7.0,7.6);house.visible=hp>0;house.scale.setScalar(Math.max(.001,.62*eb(hp)));house.rotation.y=-.3+Math.sin(t*.9)*.08*damp;
  const cp=prog(t,7.7,8.3);card.visible=cp>0;cardBase.visible=cp>0;card.scale.setScalar(Math.max(.001,.62*eb(cp)));card.rotation.y=-.35+Math.sin(t*1.1)*.1*damp;card.position.y=1.0+Math.sin(t*1.7)*.07*damp;
  const hide=1-eo(prog(t,8.9,9.5));house.scale.multiplyScalar(hide);card.scale.multiplyScalar(hide);cardBase.visible=cardBase.visible&&hide>.02;
  rayL.visible=rayL.visible&&hide>.02;rayR.visible=rayR.visible&&hide>.02;
  st.setSprite(tMutui,-1.5,3.5,.9,eo(prog(t,7.5,7.9))*hide);st.setSprite(tPrest,1.45,3.5,.9,eo(prog(t,8.0,8.4))*hide);
  // punto interrogativo sulla poltrona
  const qp=prog(t,9.2,9.8);q.visible=qp>0;q.scale.setScalar(Math.max(.001,1.5*eb(qp)));q.position.set(0,4.9+Math.sin(t*2.4)*.12*damp,.5);q.rotation.y=Math.sin(t*1.3)*.5*damp;
  st.render(t,{shakes:[.12,3.0,9.2],flashes:[.12,9.2]});
}
boot(st,draw);
</script></body></html>
