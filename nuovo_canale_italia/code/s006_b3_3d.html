<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b3442;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/code/lib/three/three.module.js","three/addons/":"/code/lib/three/jsm/"}}</script>
</head><body>
<script type="module">
import {THREE,createStage,boot,prog,eo,eio,eb,clamp,rnd} from '/code/lib/stage.js';
import * as S from '/code/lib/s006.js';
import * as S4 from '/code/lib/s004.js';
// ===== Short 006 - blocco 3: BOT 12 mesi asta 9/10: 3,175% lordo; su 10.000 circa 322 lordi; titoli di Stato 12,5% -> circa 282; BTP 10 anni asta 30/10: 4,49% lordo, bloccato 10 anni =====
const DUR=29.331;
const KF=[[0,[0,2.6,8.2],[0,1.5,0]],[5.9,[.1,2.7,8.8],[0,1.5,0]],[6.0,[0,3.2,11.6],[0,2.2,0],'w'],[9.95,[0,3.2,11.6],[0,2.2,0]],[10.0,[0,2.9,9.8],[0,1.2,0],'w'],[21.3,[0,3.0,10.0],[0,1.3,0]],[21.4,[0,3.2,11.6],[0,2.2,0],'w'],[27.5,[0,3.2,11.6],[0,2.2,0]],[27.6,[0,2.5,7.6],[0,1.2,0],'w'],[DUR,[0,2.6,8.0],[0,1.2,0]]];
const st=await createStage({dur:DUR,centers:[],kf:KF,theme:S.THEME});
const {scene}=st;const m=S.mats();
S.backdrop(scene,m);
const counter=S.counter(m);scene.add(counter);
const cert=S.certificate();scene.add(cert);
const cal=S.calendar('OTTOBRE','9');scene.add(cal);
const tank=st.tank({x:0,z:0,r:.5,H:6.2,color:m.green,ticks:true});tank.g.scale.setScalar(.7);
const tank2=st.tank({x:0,z:0,r:.5,H:6.2,color:m.gold,ticks:true});tank2.g.scale.setScalar(.7);
const stack=S.noteStack(m,{w:2.5,d:1.3,h:1.2});scene.add(stack);
const lock=S.padlock(m);scene.add(lock);
const dk=(o)=>Object.assign({bg:'rgba(10,40,52,.95)',border:'#19d37a',fill:'#ffffff'},o);
const tBot=st.tag(['BOT 12 MESI'],dk({sw:3.0,font:'bold 74px PM',w:860,h:180,border:'#f3be3a'}));
const tAsta=st.tag(['ULTIMA ASTA','DEL TESORO'],dk({sw:3.0,font:'bold 64px PM',w:860,h:270}));
const tData=st.tag(['9 OTTOBRE'],dk({sw:3.0,font:'bold 76px PM',w:780,h:180,border:'#f3be3a'}));
const cPct=st.counter({w:900,h:240,sw:3.0,color:'#ffffff',border:'#19d37a',font:'82px AB',bg:'rgba(10,40,52,.95)'});
const cPct2=st.counter({w:900,h:240,sw:3.0,color:'#ffffff',border:'#f3be3a',font:'82px AB',bg:'rgba(10,40,52,.95)'});
const tDieci=st.tag(['10.000 €'],dk({sw:3.0,font:'bold 100px AB',w:760,h:200,border:'#f3be3a'}));
const t322=st.tag(['CIRCA 322 €'],{bg:'rgba(25,211,122,.97)',border:'#ffffff',fill:'#06222c',sw:3.0,font:'bold 88px AB',w:880,h:200});
const tStato=st.tag(['TITOLI DI STATO'],dk({sw:3.0,font:'bold 66px PM',w:860,h:180,border:'#f3be3a'}));
const t125=st.tag(['TASSA','12,5 %'],{bg:'rgba(229,57,43,.97)',border:'#ffffff',fill:'#ffffff',sw:3.0,font:'bold 96px AB',w:760,h:300});
const tRest=st.tag(['RESTANO'],dk({sw:3.0,font:'bold 70px PM',w:720,h:170}));
const t282=st.tag(['CIRCA 282 €'],{bg:'rgba(25,211,122,.97)',border:'#ffffff',fill:'#06222c',sw:3.0,font:'bold 88px AB',w:880,h:200});
const tBtp=st.tag(['BTP 10 ANNI'],dk({sw:3.0,font:'bold 74px PM',w:860,h:180,border:'#f3be3a'}));
const tAsta2=st.tag(['ASTA 30 OTTOBRE'],dk({sw:3.0,font:'bold 62px PM',w:900,h:180}));
const tBlocc=st.tag(['BLOCCATO','10 ANNI'],{bg:'rgba(229,57,43,.97)',border:'#ffffff',fill:'#ffffff',sw:3.0,font:'bold 90px AB',w:800,h:300});
const A=S.makeAnchor(st,KF);
function draw(t){
  const damp=1-eio(prog(t,DUR-0.55,DUR-0.06));
  cert.visible=t<4.3;cert.position.set(0,1.75+Math.sin(t*1.2)*.05*damp,.5);cert.rotation.set(-.12,Math.sin(t*.7)*.35,0);cert.scale.setScalar(Math.max(.001,eb(prog(t,.1,.6))));
  cal.visible=t>=4.3&&t<6.0;cal.position.set(0,1.8,.6);cal.rotation.set(-.08,Math.sin(t*.8)*.12,0);cal.scale.setScalar(Math.max(.001,eb(prog(t,4.35,4.85))));
  tank.g.visible=t>6.0&&t<9.95;tank.set(3.175*eo(prog(t,6.5,8.6)));tank.g.scale.setScalar(.7*Math.max(.001,eb(prog(t,6.05,6.45))));
  stack.visible=t>=10.0&&t<21.3;stack.scale.setScalar(Math.max(.001,eb(prog(t,10.05,10.5))));
  tank2.g.visible=t>21.4&&t<27.5;tank2.set(4.49*eo(prog(t,25.3,26.8)));tank2.g.scale.setScalar(.7*Math.max(.001,eb(prog(t,21.45,21.9))));
  lock.visible=t>=27.6;lock.position.set(0,.2,.4);lock.rotation.y=Math.sin(t*.9)*.35;lock.scale.setScalar(Math.max(.001,1.5*eb(prog(t,27.65,28.2))));
  A(tBot,t,0.81,.64,eo(prog(t,.3,.65))*(1-eo(prog(t,2.15,2.4))));
  A(tAsta,t,0.86,.62,eo(prog(t,2.3,2.65))*(1-eo(prog(t,4.1,4.4))));
  A(tData,t,0.77,.64,eo(prog(t,4.45,4.8))*(1-eo(prog(t,5.8,6.0))));
  cPct.userData.set(t<8.7?'3,175 %':'3,175 % LORDO');
  A(cPct,t,0.8,.62,eo(prog(t,6.45,6.8))*(1-eo(prog(t,9.75,10.0))),1+.03*Math.sin(t*8)*(t<9.7?1:0));
  A(tDieci,t,0.73,.62,eo(prog(t,10.3,10.65))*(1-eo(prog(t,11.7,12.0))));
  A(t322,t,0.86,.62,eo(prog(t,11.85,12.2))*(1-eo(prog(t,13.45,13.75))));
  A(tStato,t,0.86,.64,eo(prog(t,13.55,13.9))*(1-eo(prog(t,16.1,16.4))));
  A(t125,t,0.73,.6,eo(prog(t,16.2,16.55))*(1-eo(prog(t,17.8,18.1))));
  A(tRest,t,0.68,.64,eo(prog(t,17.9,18.2))*(1-eo(prog(t,18.95,19.2))));
  A(t282,t,0.86,.62,eo(prog(t,19.0,19.35))*(1-eo(prog(t,21.15,21.4))));
  A(tBtp,t,0.81,.64,eo(prog(t,21.55,21.9))*(1-eo(prog(t,23.2,23.45))));
  A(tAsta2,t,0.88,.64,eo(prog(t,23.35,23.7))*(1-eo(prog(t,25.1,25.35))));
  cPct2.userData.set(t<26.5?'4,49 %':'4,49 % LORDO');
  A(cPct2,t,0.8,.62,eo(prog(t,25.3,25.65))*(1-eo(prog(t,27.4,27.6))),1+.03*Math.sin(t*8)*(t<27.4?1:0));
  A(tBlocc,t,0.77,.58,eo(prog(t,27.7,28.05)),(1+(1-eb(prog(t,27.7,28.1)))*.1)*(1+.03*Math.sin(t*8)*damp));
  st.render(t,{shakes:[27.7],flashes:[27.7]});
}
boot(st,draw);
</script></body></html>
