 ps.forEach(([x,y,s])=>{const q=personI(g,s,'#0B4A50');q.setAttribute('transform','translate('+x+' '+y+')');});

function strip(p,lines,fs){fs=fs||46;const c=el('g',{},p);const w=900,h=lines.length*fs*1.3+64;
 const n=Math.round(w/30),st=w/n;let d='M'+(-w/2)+' '+(-h/2);

 for(let k=n;k>0;k--)d+=' L'+(-w/2+k*st-st/2)+' '+(h/2+12)+' L'+(-w/2+(k-1)*st)+' '+(h/2);
 d+='Z';

 el('rect',{x:-w/2+4,y:-h/2+4,width:34,height:h-8,rx:4,fill:GRN},c);

 for(let k=0;k<3;k++){let d='M0 0';for(let j=0;j<9;j++)d+=' h70 v-52';const g=el('path',{d:d,fill:'none',stroke:'#9BF0DB','stroke-opacity':.13,'stroke-width':7,'stroke-linejoin':'round'},b);

const DUR=[340, 471, 400, 250, 334, 471].map(x=>x/30);
const TX=["La pensione di reversibilità, quella che arriva dopo la morte del coniuge, può essere tagliata dall'Inps. In quali casi succede, e di quanto? Meglio saperlo prima di fare la domanda.", "E quanto spetta a chi resta? Il coniuge non è l'unico: possono averne diritto anche i figli, i genitori, i fratelli e le sorelle. La percentuale della pensione di chi è mancato cambia a seconda di chi sei. Quali percentuali, e a quali condizioni?", "Per il taglio conta un reddito, ma non tutto: alcune voci l'Inps non le conta. Quali? E da quali cifre scatta la riduzione? Le soglie cambiano ogni gennaio, e nel video trovi quelle del duemilaventisei.", "Esiste un caso in cui il taglio non scatta proprio, anche con un reddito alto. Quale? E c'è un meccanismo che cambia i conti, e lo scopri alla fine del video.", "Poi ci sono tre situazioni delicate: se ti risposi, se c'è anche un ex coniuge e se non eravate sposati. Per ognuna la regola è precisa, e la spieghiamo nel video.", "Scrivi nei commenti: al coniuge senza figli spetta il sessanta, l'ottanta o il cento per cento della pensione? La risposta e due esempi in euro sono nel video correlato qui sotto: toccalo adesso. Metti mi piace e iscriviti a Conti in Pensione."];
// tempi: proporzionali ai caratteri, con pause piu' lunghe a virgole/due punti e a punti/domande
function vt(i,frag){const s=TX[i];const k=s.indexOf(frag);if(k<0)throw new Error('frag '+frag);
 const wt=c=>/[,:;]/.test(c)?7:/[.?!]/.test(c)?12:1;let tot=0,acc=0;for(let j=0;j<s.length;j++){const w=wt(s[j]);tot+=w;if(j<k)acc+=w;}
 return (DUR[i]-0.6)*acc/tot;}
const GAP=0.7;
function plan(i,frags){const n=frags.length+1,lim=0.8*DUR[i]-0.9;let t=frags.map(f=>vt(i,f)).concat([99]);
 t[0]=Math.max(t[0],1.0);for(let k=1;k<n;k++)t[k]=Math.max(t[k],t[k-1]+GAP);
 for(let k=n-1;k>=0;k--){const m=lim-(n-1-k)*GAP;if(t[k]>m)t[k]=m;}
 return t;}
