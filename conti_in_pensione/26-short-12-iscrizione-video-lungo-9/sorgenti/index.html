 el('path',{d:'M-28 40 Q0 66 28 40',fill:'none',stroke:'#B5523B','stroke-width':8,'stroke-linecap':'round'},g);return g;}

 el('path',{d:`M${-r*.4} ${-r*.4} L${r*.4} ${r*.4} M${r*.4} ${-r*.4} L${-r*.4} ${r*.4}`,stroke:'#fff','stroke-width':r*.26,'stroke-linecap':'round'},g);return g;}

 el('rect',{x:-58*s,y:-12*s,width:116*s,height:90*s,rx:20*s,fill:YEL,stroke:'#fff','stroke-width':7*s},g);el('circle',{cx:0,cy:30*s,r:12*s,fill:'#7A2A00'},g);return g;}

// tempi sulla voce (stima a caratteri dal testo del blocco e dalla durata dello screenshot, regola N.16).
// Regole N.15/N.18: comparsa 0,9 s, ogni elemento resta fino a fine scena, distanza >= 1,0 s tra elementi, ultimo completo entro l'80 % del blocco.
const DUR=[425,439,425,459,405].map(x=>x/30);
const TX=["Pensioni di dicembre: due pensionati senza altri redditi, con quasi la stessa pensione. Uno prende una parte del bonus, l'altro zero. La differenza? Dieci euro al mese. Non è uno sbaglio: è un limite che sta nella legge.", "A dicembre possono arrivare tre pagamenti: la tredicesima, un bonus di centocinquantaquattro euro e novantaquattro centesimi, e per qualcuno anche la quattordicesima. L'anno scorso il bonus l'hanno ricevuto più di quattrocentomila pensionati.", "Ma ogni pagamento ha le sue regole, e chi è a un passo dal limite può scoprirlo quando la rata è già arrivata. Per questo confrontiamo tre vicini: Franco, Anna e Lucia. Uno resta senza bonus. Chi dei tre sei tu, lo vedi nel video.", "Se hai una pensione e a dicembre aspetti qualcosa in più, questo canale è per te. Facciamo i conti in euro, con i limiti veri dell'Inps. Siamo ancora in pochi: il nostro obiettivo sono mille iscritti, e iscriversi è gratis, basta un tocco.", "Tocca il video correlato: il dicembre dei tre vicini, con i conti. Iscriviti a Conti in Pensione e metti mi piace: ci aiuti a crescere. E scrivici nei commenti: Franco, Anna o Lucia, chi sei tu?"];
function vt(i,frag){const s=TX[i];const k=s.indexOf(frag);if(k<0)throw new Error('frag '+frag);return 0.15+(DUR[i]-0.6)*k/s.length-0.15;}
const GAP=1.0;
// tempo di avvio di ogni elemento: sulla parola, poi distanza minima e ultimo entro l'80 %
function plan(i,frags){const n=frags.length+1,lim=0.8*DUR[i]-0.9;let t=frags.map(f=>vt(i,f)).concat([99]);
 t[0]=Math.max(t[0],GAP);for(let k=1;k<n;k++)t[k]=Math.max(t[k],t[k-1]+GAP);
 for(let k=n-1;k>=0;k--){const m=lim-(n-1-k)*GAP;if(t[k]>m)t[k]=m;}
 return t;}
