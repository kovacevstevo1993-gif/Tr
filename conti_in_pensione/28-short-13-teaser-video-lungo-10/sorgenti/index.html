// Regole N.15/N.18: comparsa 0,9 s, ogni elemento resta fino a fine scena, distanza >= 1,0 s tra elementi, ultimo completo entro l'80 % del blocco.
const DUR=[436, 352, 346, 310, 305, 369].map(x=>x/30);
const TX=["Pensione alle casalinghe: dopo una certa età, anche chi non ha mai lavorato può ricevere ogni mese un aiuto dall'Inps, senza pagare tasse. Ma se sei sposata conta anche la pensione di tuo marito, e c'è una cifra che decide quanto ricevi.", "Funziona così: per le coppie l'Inps guarda i redditi di tutti e due, e quello di lui conta al netto delle tasse. Superata una prima soglia, ogni euro in più che prende lui è un euro in meno per te.", "E così l'importo scende fino ad arrivare a zero. Se tu non hai altri redditi, quanto deve prendere tuo marito perché succeda? Non lo diciamo qui: esiste una cifra precisa, e oltre quella l'aiuto non spetta più.", "Se invece sei vedova, il conto è un altro: per l'Inps non sei più sposata, quindi vale il limite di una persona sola. E cosa conta come reddito e cosa no può cambiare il risultato.", "C'è anche un errore che costa soldi: aspettare. L'aiuto parte dal mese dopo la domanda, quindi ogni mese che passa prima che tu la faccia è un mese che non ti viene pagato.", "La cifra e il conto completo li trovi nel video correlato qui sotto: toccalo adesso. Metti mi piace e iscriviti a Conti in Pensione. E manda questo short a una donna che conosci: sapere come funziona può servirle."];
function vt(i,frag){const s=TX[i];const k=s.indexOf(frag);if(k<0)throw new Error('frag '+frag);return 0.15+(DUR[i]-0.6)*k/s.length-0.15;}

 for(let k=n-1;k>=0;k--){const m=lim-(n-1-k)*GAP;if(t[k]>m)t[k]=m;}
 return t;}
