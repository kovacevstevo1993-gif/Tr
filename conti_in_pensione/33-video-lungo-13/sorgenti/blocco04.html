// ---- tempi del parlato: ogni frase ha il suo istante, calcolato sul testo e sulla durata ----
function speech(text,dur){const lead=0.35,tail=0.5;text=text.replace(/’/g,"'");
 // modello calibrato su 69 blocchi reali: 0,145 s per sillaba + pause alla punteggiatura (virgola 0,13; due punti 0,36; punto 0,34; !? 0,47; ... 0,56)
 const T=new Array(text.length+1).fill(0);let t=0;let i=0;
 while(i<text.length){const ch=text[i];
  if(/[A-Za-zàèéìòùÀÈÉÌÒÙ]/.test(ch)){let j=i;while(j<text.length&&/[A-Za-zàèéìòùÀÈÉÌÒÙ]/.test(text[j]))j++;
   const w=text.slice(i,j);const sy=Math.max(1,(w.toLowerCase().match(/[aeiouàèéìòù]+/g)||[]).length);const d=0.145*sy;
   for(let k=i;k<j;k++)T[k]=t+d*(k-i)/(j-i);t+=d;i=j;continue;}
  T[i]=t;
  if(ch===',')t+=0.129;else if(ch===':'||ch===';')t+=0.363;else if(ch==='!'||ch==='?')t+=0.467;
  else if(ch==='.'){t+=(text[i+1]==='.'||text[i-1]==='.')?0.187:0.336;}
  i++;}
 T[text.length]=t;const tot=t;
 return function(p){let off=0;if(typeof p==='number')return p;if(Array.isArray(p)){off=p[1];p=p[0];}p=p.replace(/’/g,"'");
  const k=text.indexOf(p);if(k<0)throw new Error('frase non trovata: '+p);
  return lead+(T[k]/tot)*(dur-lead-tail)+off;};}

function EQ(y,parts,fs0,minw0){fs0=fs0||76;minw0=minw0||280;const gap0=34;
 const ws=parts.map(p=>p[0]=='op'?100:bnW(p[1],(p[3]&&p[3].fs)||fs0,p[3]&&p[3].sub,minw0));
 const sumw=ws.reduce((a,b)=>a+b,0);const gap=Math.min(64,Math.max(gap0,(1840-sumw)/(parts.length-1)));const tot=sumw+gap*(parts.length-1);let x=960-tot/2;const out=[];
 parts.forEach((p,i)=>{const cx=x+ws[i]/2;x+=ws[i]+gap;const o=p[3]||{};
  if(p[0]=='op')out.push(I('op',[p[1]],cx,y,p[2]));
  else{const fs=o.fs||fs0;out.push(I('num',[p[1],fs,o.fill||'url(#g_paper)',o.sub,o.subfill,minw0],cx,y+0.125*fs-(o.sub?29:0),p[2]));}});
 return out;}

function mkBlk(text,dur,scenes){const sp=speech(text,dur);
 const st=scenes.map((sc,i)=>i==0?0:Math.max(0.8,sp(sc.at)-0.3+(sc.sh||0)));
 scenes.forEach((sc,i)=>{const s=st[i],e=(i<scenes.length-1)?st[i+1]:dur;const L=e-s;
  const D=0.9;sc._D=D;sc._L=L;
  if(L<5.0)throw new Error('REGOLA N.18: scena troppo corta ('+L.toFixed(1)+' s, minimo 5 s): unire le scene');
  // regola dell'utente: tutto completo entro l'80 % della slide (e almeno 0,8 s prima della dissolvenza), poi fermo
  const A0=0.5;
  sc.items.forEach(it=>{it._raw=Math.max(A0,sp(it.at)-0.2-s);});
  const lim=Math.max(A0+0.05,Math.min(0.8*L-D,L-0.8-D));const amax=Math.max(...sc.items.map(it=>it._raw));
  const k=(amax>lim)?(lim-A0)/Math.max(0.01,amax-A0):1;
  sc.items.forEach(it=>{it._a=A0+(it._raw-A0)*k;});
  // almeno 0,45 s tra un elemento e il successivo (se c'e' spazio), sempre dentro il limite dell'80 %
  {const ord=[...sc.items].sort((x,y)=>x._a-y._a);const n=ord.length;const gap=n>1?Math.min(0.45,(lim-A0)/(n-1)):0;
   for(let q=1;q<n;q++){ord[q]._a=Math.max(ord[q]._a,ord[q-1]._a+gap);}
   const mx=Math.max(...ord.map(o=>o._a));if(mx>lim&&n>1){const kk=(lim-A0)/(mx-A0);ord.forEach(o=>{o._a=A0+(o._a-A0)*kk;});}}
  SB.push({s,e,build(g){const o={items:[]};
   o.top=el('g',{},g);topLabel(o.top,sc.top);
   o.cap=el('g',{},g);if(sc.cap)cap(o.cap,sc.cap,sc.capSize||44);
   sc.items.forEach(it=>{const n=el('g',{},g);BUILD[it.k](n,...it.a);o.items.push({n,it});});
   this.o=o;},
  update(t){const o=this.o;T(o.top,960,100,0,1);T(o.cap,960,950,0,pop(t,0.15,Math.min(1.0,Math.max(0.45,L-0.8))));
   o.items.forEach(({n,it})=>{const a=it._a;T(n,it.x,it.y,it.r||0,(it.s||1)*pop(t,a,a+D));});}});});
 window.__IT=scenes.map(sc=>sc.items.map(it=>it._a));window.__SC=scenes.map((sc,i)=>[st[i],(i<scenes.length-1)?st[i+1]:dur]);}

// ===== VIDEO 12 (coefficienti di trasformazione 2027) - elementi nuovi + 15 blocchi =====
// Un po' diverso dai video 8-11 (N.37, N.47), stessi colori: titoletto con numero del blocco e striscia di avanzamento a 15 tacche,
// didascalia con filo giallo in alto, decreto con sigillo, scalinata, grafico a barre per età, scala dei mesi con bandierine.
const NB12=15;
const TABD12=[-1.21,-1.25,-1.31,-1.34,-1.39,-1.46,-1.48,-1.55,-1.60,-1.64,-1.68,-1.74,-1.83,-1.90,-1.97];
function topLabel(g,s){const t=el('g',{transform:'translate(-840 0)'},g);
 const b=el('g',{transform:'translate(0 0)'},t);
 el('rect',{x:-56,y:-42,width:112,height:84,rx:22,fill:'#06303A',stroke:'#7FF0D2','stroke-width':3,filter:'url(#g_sh3)'},b);
 txt(b,(N<10?'0':'')+N,0,15,42,AMB,'900');
 const x=txt(t,s,86,12,36,'#7FF0D2','bold','start');x.setAttribute('letter-spacing','6');
 let w=tw(s,36)+s.length*6;try{w=x.getBBox().width;}catch(e){}
 el('rect',{x:86,y:30,width:Math.min(w,150),height:5,rx:2.5,fill:AMB},t);
 const X0=1320,DX=28;
 for(let i=0;i<NB12;i++){const on=(i+1)===N;el('rect',{x:X0+i*DX,y:on?-16:-9,width:22,height:on?32:18,rx:5,fill:on?AMB:'#7FF0D2',opacity:on?1:((i+1)<N?.8:.26)},t);}
 return t;}
function cap(g,s,size){size=size||44;const c=el('g',{},g);if(!s)return c;
 const t=txt(c,s,0,0,size,'#FFFFFF','bold');let tl=mw(t,s,size);
 const maxT=1540;if(tl>maxT){size=size*maxT/tl;t.setAttribute('font-size',size.toFixed(1));tl=mw(t,s,size);}
 const padL=120,padR=60;const w=tl+padL+padR;
 t.setAttribute('x',(-w/2+padL+tl/2).toFixed(1));t.setAttribute('y',(size*0.36).toFixed(1));
 const ins=e=>{c.insertBefore(e,t);return e;};
 ins(el('rect',{x:-w/2,y:-56,width:w,height:112,rx:22,fill:'#06303A',filter:'url(#g_sh2)'}));
 ins(el('rect',{x:-w/2,y:-56,width:w,height:112,rx:22,fill:'none',stroke:'#7FF0D2','stroke-width':2.5,opacity:.45}));
 ins(el('rect',{x:-w/2+34,y:-56,width:w-68,height:7,rx:3.5,fill:AMB}));
 const ib=el('g',{transform:'translate('+(-w/2+62)+' 4)'},c);el('circle',{r:30,fill:'#0D5158',stroke:'#7FF0D2','stroke-width':3},ib);
 el('path',{d:'M-10 -14 L16 0 L-10 14 Z',fill:AMB,'stroke-linejoin':'round',stroke:AMB,'stroke-width':4},ib);
 return c;}
// ---------- decreto: foglio con testata scura, righe e sigillo ----------
function decreeB(g,w,h,head,sub){
 el('rect',{x:-w/2,y:-h/2,width:w,height:h,rx:26,fill:'url(#g_paper)',filter:'url(#g_sh)'},g);
 el('rect',{x:-w/2,y:-h/2,width:w,height:84,rx:26,fill:'#0B4A50'},g);el('rect',{x:-w/2,y:-h/2+50,width:w,height:34,fill:'#0B4A50'},g);
 el('rect',{x:-w/2,y:-h/2+80,width:w,height:5,fill:AMB},g);
 fitT(g,head,0,-h/2+42,34,'#fff','900',w-50);
 if(sub)fitT(g,sub,0,-h/2+132,34,GRN,'900',w-50);
 [0,1,2].forEach(i=>el('rect',{x:-w/2+44,y:-h/2+176+i*40,width:i==2?w*0.5:w-88,height:14,rx:7,fill:'#C3D3D7'},g));
 const sg=el('g',{transform:'translate('+(w/2-96)+' '+(h/2-84)+')'},g);
 el('circle',{r:56,fill:AMB,stroke:'#fff','stroke-width':5},sg);el('circle',{r:42,fill:'none',stroke:'#5A3300','stroke-width':3,'stroke-dasharray':'4 6'},sg);ico(sg,'stato',0.8,'#5A3300');
 return g;}
// ---------- grafico a barre per età (altezza = variazione, da zero) ----------
function agebarsB(g,W,H){const n=TABD12.length,gap=W/n,bw=gap*0.66;const base=H/2;
 el('rect',{x:-W/2-10,y:base,width:W+20,height:8,rx:4,fill:'#06303A',stroke:'#7FF0D2','stroke-width':2},g);
 TABD12.forEach((v,i)=>{const h=H*Math.abs(v)/2.2;const x=-W/2+i*gap+gap/2;const f=i/(n-1);
  const col=f<0.34?'#2B6F77':(f<0.67?'#E39A1C':'#D23A25');
  el('rect',{x:x-bw/2,y:base-h,width:bw,height:h,rx:10,fill:col,stroke:'#fff','stroke-width':3,filter:'url(#g_sh3)'},g);
  txt(g,String(57+i),x,base+46,30,'#E9FBF6','bold');});

function vbarB(g,w,h,fill,top,bottom){
 el('rect',{x:-w/2,y:-h,width:w,height:h,rx:16,fill:fill,stroke:'#fff','stroke-width':4,filter:'url(#g_sh2)'},g);
 fitT(g,top,0,-h-38,44,'#fff','900',w+120);fitT(g,bottom,0,50,34,'#E9FBF6','bold',w+120);return g;}
// ---------- scala dei mesi ----------

function flagB(g,label,fill,ph,col,dx){el('line',{x1:0,y1:0,x2:0,y2:-ph,stroke:'#fff','stroke-width':6,'stroke-linecap':'round'},g);

// ===== VIDEO 13 (pensione di reversibilita') - elementi nuovi + 22 blocchi =====
// Un po' diverso dai video 8-12 (N.37, N.47), stessi colori: titoletto con i QUATTRO PASSAGGI del video (chi / quanto / riduzione / domanda),
// didascalia a pannello con barra gialla e "i", sfondo con linee di soglia e scalinata che sale; pittogrammi di famiglia, anelli di percentuale,
// scala del reddito con le tre soglie, grafico del gradino, schermata del sito, schede a due colonne.
const NB13=22;
const PASSI13=['CHI','QUANTO','RIDUZIONE','DOMANDA'];
function passo13(n){if(n<=2)return -1;if(n<=6)return 0;if(n<=9)return 1;if(n<=16)return 2;if(n<=18)return 3;if(n==19)return 2;return 4;}
function topLabel(g,s){const t=el('g',{transform:'translate(-840 0)'},g);
 const b=el('g',{},t);
 el('rect',{x:-56,y:-42,width:112,height:84,rx:22,fill:'#06303A',stroke:'#7FF0D2','stroke-width':3,filter:'url(#g_sh3)'},b);
 txt(b,(N<10?'0':'')+N,0,15,42,AMB,'900');
 const x=txt(t,s,86,12,36,'#7FF0D2','bold','start');x.setAttribute('letter-spacing','6');
 let w=tw(s,36)+s.length*6;try{w=x.getBBox().width;}catch(e){}
 el('rect',{x:86,y:30,width:Math.min(w,150),height:5,rx:2.5,fill:AMB},t);
 // stepper dei quattro passaggi (a destra)
 const a=passo13(N);const CW=196,CG=8,X0=1730-(4*CW+3*CG);
 PASSI13.forEach((p,i)=>{const on=(i===a),done=(i<a)||a===4;const cx=X0+i*(CW+CG);
  el('rect',{x:cx,y:-23,width:CW,height:46,rx:23,fill:on?AMB:(done?'#1B9F81':'#06303A'),stroke:on?'#fff':'#7FF0D2','stroke-width':on?3:2,opacity:on?1:(done?0.95:0.5)},t);
  txt(t,(i+1)+' '+p,cx+CW/2,8,21,on?'#5A3300':'#fff','900');});
 return t;}
function cap(g,s,size){size=size||44;const c=el('g',{},g);if(!s)return c;
 const t=txt(c,s,0,0,size,'#FFFFFF','bold');let tl=mw(t,s,size);
 const maxT=1540;if(tl>maxT){size=size*maxT/tl;t.setAttribute('font-size',size.toFixed(1));tl=mw(t,s,size);}
 const padL=130,padR=60;const w=tl+padL+padR;
 t.setAttribute('x',(-w/2+padL+tl/2).toFixed(1));t.setAttribute('y',(size*0.36).toFixed(1));
 const ins=e=>{c.insertBefore(e,t);return e;};
 ins(el('rect',{x:-w/2,y:-56,width:w,height:112,rx:20,fill:'#06303A',filter:'url(#g_sh2)'}));
 ins(el('rect',{x:-w/2,y:-56,width:w,height:112,rx:20,fill:'none',stroke:'#7FF0D2','stroke-width':2.5,opacity:.4}));
 ins(el('rect',{x:-w/2,y:-56,width:98,height:112,rx:20,fill:AMB}));
