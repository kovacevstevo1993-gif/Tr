<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}svg{display:block}.t{font-family:'DejaVu Sans','Liberation Sans',Arial,sans-serif;font-weight:900}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
<radialGradient id="bg" cx="0.5" cy="0.5" r="1"><stop offset="0" stop-color="#25A9AE"/><stop offset="0.5" stop-color="#0D5158"/><stop offset="1" stop-color="#03181B"/></radialGradient>
<linearGradient id="wb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE7E9"/></linearGradient>
<linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5A43"/><stop offset="1" stop-color="#C0200F"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#021A1D" flood-opacity="0.75"/></filter>
<filter id="gl"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<g opacity="0.10" fill="#fff"><path d="M540 1000 L-200 300 L0 100Z"/><path d="M540 1000 L300 -100 L520 -100Z"/><path d="M540 1000 L760 -100 L980 -100Z"/><path d="M540 1000 L1300 400 L1300 700Z"/><path d="M540 1000 L1300 1400 L1300 1600Z"/><path d="M540 1000 L-200 1500 L0 1750Z"/></g>
<circle cx="540" cy="1000" r="450" fill="#FFD43B" opacity="0.14" filter="url(#gl)"/>
<!-- titolo gigante in alto -->
<g class="t" text-anchor="middle" stroke="#06282C" stroke-linejoin="round" paint-order="stroke">
<text x="540" y="210" font-size="172" fill="#fff" stroke-width="22">PENSIONI</text>
<text x="540" y="370" font-size="142" fill="#FFD43B" stroke-width="20">NOVEMBRE</text></g>
<!-- tag rosso sotto il titolo -->
<g filter="url(#sh)" transform="rotate(3 540 470)"><rect x="110" y="420" width="860" height="104" rx="22" fill="url(#rb)" stroke="#fff" stroke-width="8"/></g>
<text x="540" y="494" class="t" font-size="54" fill="#fff" text-anchor="middle" transform="rotate(3 540 470)">⚠ CONTROLLA IL CEDOLINO</text>
<!-- cedolino -->
<g transform="rotate(-3 540 950)">
<g filter="url(#sh)"><rect x="110" y="610" width="860" height="700" rx="26" fill="url(#wb)"/></g>
<rect x="110" y="610" width="860" height="120" rx="26" fill="#0D5158"/><rect x="110" y="690" width="860" height="40" fill="#0D5158"/>
<text x="540" y="692" class="t" font-size="54" fill="#fff" text-anchor="middle">CEDOLINO NOVEMBRE</text>
<g class="t" font-size="50">
<text x="160" y="820" fill="#0D5158">PENSIONE</text><text x="920" y="820" fill="#0D5158" text-anchor="end">1.400 €</text>
<line x1="160" y1="860" x2="920" y2="860" stroke="#B9CBCE" stroke-width="4"/>
<text x="160" y="960" fill="#C0200F">VOCE ?</text><text x="920" y="960" fill="#C0200F" text-anchor="end" font-size="64">−480 €</text>
<line x1="160" y1="1010" x2="920" y2="1010" stroke="#B9CBCE" stroke-width="4"/>
<text x="160" y="1110" fill="#0D5158">IN BANCA</text><text x="920" y="1120" fill="#13805F" text-anchor="end" font-size="80">920 €</text>
</g>
<!-- cerchio rosso a mano sull'importo -->
<ellipse cx="770" cy="940" rx="215" ry="88" fill="none" stroke="#E8503A" stroke-width="12" transform="rotate(-4 770 940)"/>
<!-- timbro -->
<g transform="rotate(-8 540 1230)"><rect x="190" y="1180" width="700" height="100" rx="18" fill="#fff" fill-opacity="0.9" stroke="#E8503A" stroke-width="10"/>
<text x="540" y="1253" class="t" font-size="62" fill="#E8503A" text-anchor="middle">NON È UNA MULTA</text></g>
</g>
<!-- freccia gialla verso la voce -->
<path d="M18 900 H78 V860 L150 935 L78 1010 V970 H18Z" fill="#FFD43B" stroke="#fff" stroke-width="6" stroke-linejoin="round" filter="url(#sh)"/>
<!-- striscia bianca bordo giallo -->
<g filter="url(#sh)"><rect x="50" y="1480" width="980" height="270" rx="34" fill="#fff"/><rect x="50" y="1480" width="980" height="270" rx="34" fill="none" stroke="#FFD43B" stroke-width="10"/></g>
<text x="540" y="1600" class="t" font-size="80" fill="#0D5158" text-anchor="middle">PERCHÉ 480 EURO</text>
<text x="540" y="1705" class="t" font-size="80" fill="#C0200F" text-anchor="middle">IN MENO?</text>
</svg></body></html>
